<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Lab Detective - investigation skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--bg:#0f3d2a;--card:#fffbea;--ink:#23311f;--soft:#5d6b52;--line:#c9d8a8;--brand:#e8710a;--brand2:#f59e0b;--tint:#ecf6cf;
--good:#2e9e4a;--goodbg:#dff4d2;--bad:#d6452d;--badbg:#fde1d8;--warn:#e8a200;--warnbg:#fdf0c4;
--font:"Fredoka","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 12% 18%,rgba(163,230,53,.18) 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,rgba(34,197,94,.2) 0 90px,transparent 91px),radial-gradient(circle at 40% 92%,rgba(250,204,21,.12) 0 70px,transparent 71px);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
svg text{font-family:var(--font)}
.wrap{max-width:1040px;margin:0 auto;padding:12px 12px 40px}
.btn{font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:20px;box-shadow:0 5px 0 #9a4a05;min-height:52px;min-width:52px;padding:10px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a4a05}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:30px;padding:6px 12px;font-weight:600;font-size:16px;white-space:nowrap}
h1{color:#fffbea;font-size:32px;margin:16px 0 4px;line-height:1.15}
h3.sec{color:#fffbea;margin:22px 0 10px;font-size:22px}
.sub{color:#cfe8c4;margin:0 0 14px}
.card{background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.25);padding:12px 14px;min-width:0}
details.ru{margin-top:4px;font-size:16px}
details.ru summary{cursor:pointer;font-weight:600;color:#9a4a05;list-style:none;padding:5px 0;min-height:34px}
details.ru summary::-webkit-details-marker{display:none}
details.ru summary::before{content:"▸ "}
details.ru[open] summary::before{content:"▾ "}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gl span{background:var(--tint);border-radius:12px;padding:3px 9px;font-size:15px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.lv{position:relative;text-align:left;background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:0 7px 0 rgba(0,0,0,.25);padding:10px 12px;min-height:126px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lv:active{transform:translateY(3px)}
.lv .ico{font-size:30px;line-height:1.15}
.lv .nm{font-weight:700;line-height:1.2}
.lv .ds{font-size:14px;color:var(--soft);line-height:1.25}
.lv .st{margin-top:auto;color:var(--brand2);font-size:20px;letter-spacing:2px}
.lv .st i{font-style:normal;color:#d9dec6}
.lv.case{border-color:#e9c46a;background:#fff6d8}
.lv.solved::after{content:"SOLVED";position:absolute;top:10px;right:8px;font-size:11px;font-weight:700;color:var(--bad);border:3px solid var(--bad);border-radius:8px;padding:0 5px;transform:rotate(8deg)}
.ptop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ptop .btn{min-height:48px;padding:6px 14px;font-size:16px}
.ptitle{flex:1;min-width:0;color:#fffbea;font-weight:700;line-height:1.15;font-size:17px}
.ptitle small{display:block;color:#cfe8c4;font-weight:600;font-size:13px}
.clues{display:flex;gap:4px;margin:0 0 8px}
.clues i{flex:1;height:10px;border-radius:6px;background:rgba(255,251,234,.22)}
.clues i.on{background:#a3e635}
.clues i.now{background:var(--brand2)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"task" "stage" "ctrl";gap:10px}
#task{grid-area:task}
#stage{grid-area:stage}
#ctrl{grid-area:ctrl;min-width:0}
#stage:empty{display:none}
.case-q{font-size:14px;color:var(--soft);font-weight:600;line-height:1.3;margin-bottom:4px}
.instr{font-weight:700;font-size:20px;line-height:1.3}
.sub2{font-size:16px;line-height:1.35;margin-top:3px}
#stage.card{padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.inst{display:block;width:100%;height:min(290px,32vh)}
.inst.wide{height:auto;max-height:300px}
.inst.round{height:min(250px,30vh)}
.graph{display:block;width:100%;max-width:540px;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
table.res{border-collapse:collapse;width:100%;max-width:520px;font-size:15px;text-align:center}
table.res th,table.res td{border:2px solid var(--line);padding:3px 4px;line-height:1.25}
table.res th{background:var(--tint);font-weight:700}
table.res.tap td{padding:12px 4px;cursor:pointer;font-size:20px;font-weight:600;background:#fff}
table.res.tap tr.sel td{background:#ffe8b0}
table.res.tap tr.no td{background:var(--badbg)}
table.res.tap tr.yes td{background:var(--goodbg)}
.disp{background:#fff;border:4px solid var(--brand);border-radius:18px;min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px;font-weight:700;margin-bottom:8px}
.disp .ph{color:#b9c3a4;font-size:19px;font-weight:600}
.disp .unit{color:var(--soft);font-size:22px}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.key{min-height:52px;border:0;border-radius:16px;background:var(--card);font-size:25px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.28);user-select:none;-webkit-user-select:none}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.key.fn{background:var(--tint)}
.key.ok{background:var(--brand);color:#fff;box-shadow:0 4px 0 #9a4a05;grid-column:span 3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:60px;border:4px solid var(--line);border-radius:20px;background:var(--card);font-size:19px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.25);padding:8px 12px;text-align:left;line-height:1.3}
.opt.no{background:var(--badbg);border-color:var(--bad);opacity:.7;cursor:default}
.opt.yes{background:var(--goodbg);border-color:var(--good)}
.opt:disabled{cursor:default}
.vcard{background:var(--card);border:4px solid var(--line);border-radius:20px;padding:8px 10px;margin-bottom:9px}
.vcard.no{border-color:var(--bad);background:var(--badbg)}
.vcard.yes{border-color:var(--good);background:var(--goodbg)}
.vcard .t{font-weight:700;line-height:1.25;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:48px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:600;line-height:1.15;padding:2px}
.seg button.sel{background:var(--brand);border-color:#9a4a05;color:#fff}
.wide{width:100%;margin-top:10px;font-size:20px;min-height:58px}
table.res.wt th{text-align:left;font-size:13px;width:34%}
table.res.wt td.now{background:#ffb84d;font-weight:700}
table.res.wt td{font-weight:600}
.pointno{color:#fffbea;font-weight:700;text-align:center;margin-bottom:6px;font-size:15px}
.nudge{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nudge .btn{min-height:52px;padding:4px;font-size:22px}
.fb{border:4px solid var(--good);background:var(--goodbg);border-radius:24px;padding:10px 14px;margin-bottom:10px}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb h2{margin:0 0 4px;font-size:20px}
.fb .trap{background:var(--warnbg);border-radius:14px;padding:7px 10px;margin:6px 0;font-weight:600}
.fb ol{margin:6px 0;padding-left:22px}
.fb li{margin:4px 0}
.fb .act{margin-top:8px}
.fb .act .btn{width:100%;font-size:19px}
.done{text-align:center;max-width:580px;margin:20px auto}
.done .big{font-size:60px;color:var(--brand2);letter-spacing:6px}
.done .big i{font-style:normal;color:#d9dec6}
.done .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stamp{display:inline-block;border:6px solid var(--bad);color:var(--bad);font-weight:700;font-size:28px;border-radius:14px;padding:4px 18px;transform:rotate(-7deg);margin:8px}
@media (max-width:600px){body{font-size:17px}.map{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chip{font-size:14px;padding:5px 9px}.instr{font-size:18px}}
@media (min-width:700px) and (max-width:899px){.inst{height:440px}.inst.round{height:360px}.inst.wide{height:auto}.key{min-height:62px}.graph{max-width:640px}}
@media (min-width:900px){
 .pgrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"stage task" "stage ctrl";grid-template-rows:auto 1fr;align-items:start}
 .pgrid.nostage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"task ctrl";grid-template-rows:auto}
 .inst{height:min(520px,calc(100vh - 160px))}.inst.wide{height:auto;max-height:400px}.inst.round{height:min(440px,calc(100vh - 160px))}
 .graph{max-width:min(560px,calc((100vh - 270px)*1.06))}
}
@media (min-width:900px) and (max-height:880px){.key{min-height:42px;font-size:22px}.pad{gap:6px}.disp{min-height:46px;font-size:26px}.fb{font-size:16px;padding:8px 12px}.fb ol{margin:3px 0}.fb li{margin:1px 0}.fb h2{font-size:18px;margin:0}.fb .trap{margin:4px 0;padding:5px 9px}.opt{min-height:52px;font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* =====================================================================
   Science Lab Detective - scientific enquiry practice. All data generated.
   Storage (every access guarded):
     'sq:mock1-checkpoint-dec'  quiz record; the game only adds to "xp"
     'sq:profile'               shared daily streak {day, streak}
     'sq:game:lab-detective'    game progress (no "xp" field)
   QA: ?level=1..19 [&step=n] [&tier=1..3] [&seed=n]
       [&show=wrong|solution|right|done]     ?selftest
   ===================================================================== */
'use strict';
const QS=new URLSearchParams(location.search), SELFTEST=QS.has('selftest');
const GKEY='sq:game:lab-detective', QKEY='sq:mock1-checkpoint-dec', PKEY='sq:profile';
let seed=QS.has('seed')?(+QS.get('seed')>>>0):(SELFTEST?20261203:((Date.now()^(Math.random()*1e9))>>>0));
function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const one=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickN=(a,n)=>shuffle(a).slice(0,n);
const num=v=>{const r=Math.round(v*100)/100;return (r<0?'−':'')+String(Math.abs(r))};
const toNum=s=>{s=String(s).trim().replace(/−/g,'-').replace(',','.');return /^-?\d+(\.\d*)?$/.test(s)?Number(s):NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const low=s=>s.charAt(0).toLowerCase()+s.slice(1);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* =====================================================================
   INSTRUMENTS (SVG). cls "lb" = scale numbers, "tk" = tick marks,
   "ptr"/"liq"/"men"/"obj"/"ndl" = the thing to be read.
   ===================================================================== */
const TOOLS={
  thermo:{name:'thermometer',unit:'°C',q:'temperature',tip:'Read the top of the liquid. Keep your eye level with it.',ru:'Смотри на верх столбика жидкости, глаза на его уровне.'},
  cyl:{name:'measuring cylinder',unit:'ml',q:'volume of a liquid',tip:'Read the BOTTOM of the curved surface (the meniscus), with your eye level with it.',ru:'Читай по НИЖНЕЙ точке изогнутой поверхности (мениска), глаза на ее уровне.'},
  force:{name:'force meter',unit:'N',q:'force',tip:'Read the scale at the pointer. On this meter the numbers get bigger going DOWN.',ru:'Смотри, где стрелка-указатель. На этом динамометре числа растут ВНИЗ.'},
  ruler:{name:'ruler or tape measure',unit:'cm',q:'length',tip:'Start at the 0 mark and read where the object ends.',ru:'Начинай от отметки 0 и смотри, где кончается предмет.'},
  dial:{name:'stopwatch',unit:'s',q:'time',tip:'Follow the needle to the scale and count the small marks.',ru:'Посмотри, куда показывает стрелка, и посчитай маленькие деления.'},
  meter:{name:'sound level meter',unit:'dB',q:'loudness of a sound',tip:'Follow the needle to the scale and count the small marks.',ru:'Посмотри, куда показывает стрелка, и посчитай маленькие деления.'},
  balance:{name:'balance (scales)',unit:'g',q:'mass'}
};
/* cfg = {min,max,major,minor,unit?} */
function instSVG(type,cfg,v,hi){
  const u=cfg.unit||TOOLS[type].unit,n=Math.round((cfg.max-cfg.min)/cfg.minor),per=Math.round(cfg.major/cfg.minor);
  const val=i=>cfg.min+i*cfg.minor,frac=x=>(x-cfg.min)/(cfg.max-cfg.min),R2=x=>Math.round(x*100)/100;
  const isMaj=i=>Math.abs(val(i)/cfg.major-Math.round(val(i)/cfg.major))<1e-6;
  const isMid=i=>per%2===0&&Math.abs(val(i)/(cfg.major/2)-Math.round(val(i)/(cfg.major/2)))<1e-6;
  const lit=i=>hi&&val(i)>=hi.a-1e-9&&val(i)<=hi.b+1e-9;
  const tick=(i,x1,y1,x2,y2)=>'<line class="tk" x1="'+R2(x1)+'" y1="'+R2(y1)+'" x2="'+R2(x2)+'" y2="'+R2(y2)+'" stroke="'+(lit(i)?'#d6452d':'#23311f')+'" stroke-width="'+(isMaj(i)?2.6:lit(i)?2.2:1.3)+'"/>';
  const lab=(i,x,y,a,size)=>'<text class="lb" x="'+R2(x)+'" y="'+R2(y)+'" dy="0.35em" text-anchor="'+a+'" font-size="'+(size||19)+'" font-weight="700" fill="'+(hi&&(Math.abs(val(i)-hi.a)<1e-9||Math.abs(val(i)-hi.b)<1e-9)?'#d6452d':'#23311f')+'">'+num(val(i))+'</text>';
  let b='',vb,cls='inst';
  if(type==='thermo'){
    vb='0 0 200 380';const Y=x=>R2(320-280*frac(x));
    b+='<rect x="62" y="20" width="30" height="320" rx="15" fill="#fff" stroke="#23311f" stroke-width="3"/><circle cx="77" cy="347" r="24" fill="#d6452d" stroke="#23311f" stroke-width="3"/>';
    b+='<rect class="liq" x="68" y="'+Y(v)+'" width="18" height="'+R2(335-Y(v))+'" fill="#d6452d"/>';
    for(let i=0;i<=n;i++){const y=Y(val(i));b+=tick(i,92,y,isMaj(i)?114:isMid(i)?108:103,y);if(isMaj(i))b+=lab(i,120,y,'start')}
    b+='<text x="150" y="22" font-size="19" font-weight="700" fill="#5d6b52">'+u+'</text>';
  }else if(type==='cyl'){
    vb='0 0 200 380';const Y=x=>R2(330-290*frac(x)),y=Y(v);
    b+='<path d="M45 335 L45 22 M135 22 L135 335" stroke="#23311f" stroke-width="3" fill="none"/><path d="M30 366 L150 366 L135 335 L45 335 Z" fill="#cfd8dc" stroke="#23311f" stroke-width="3"/>';
    b+='<path d="M46.5 '+R2(y-7)+' Q90 '+R2(y+7)+' 133.5 '+R2(y-7)+' L133.5 334 L46.5 334 Z" fill="#9fd4f5"/><path class="men" d="M46.5 '+R2(y-7)+' Q90 '+R2(y+7)+' 133.5 '+R2(y-7)+'" fill="none" stroke="#1565a8" stroke-width="2.5"/>';
    for(let i=0;i<=n;i++){const yy=Y(val(i));b+=tick(i,isMaj(i)?78:isMid(i)?88:94,yy,133.5,yy);if(isMaj(i))b+=lab(i,143,yy,'start')}
    b+='<text x="90" y="16" font-size="19" font-weight="700" fill="#5d6b52" text-anchor="middle">'+u+'</text>';
  }else if(type==='force'){
    vb='0 0 200 380';const Y=x=>R2(56+250*frac(x)),y=Y(v);
    b+='<circle cx="88" cy="14" r="9" fill="none" stroke="#23311f" stroke-width="4"/><rect x="45" y="24" width="108" height="300" rx="16" fill="#fff" stroke="#23311f" stroke-width="3"/>';
    let z='M62 32';const m=10;for(let i=1;i<=m;i++)z+=' L'+(i%2?52:72)+' '+R2(32+(y-32)*i/(m+1));z+=' L62 '+y;
    b+='<path d="'+z+'" fill="none" stroke="#78909c" stroke-width="3"/><line x1="62" y1="'+y+'" x2="62" y2="352" stroke="#78909c" stroke-width="4"/><path d="M62 352 q0 16 -12 12" fill="none" stroke="#23311f" stroke-width="4"/>';
    for(let i=0;i<=n;i++){const yy=Y(val(i));b+=tick(i,88,yy,isMaj(i)?112:isMid(i)?108:104,yy);if(isMaj(i))b+=lab(i,118,yy,'start')}
    b+='<line class="ptr" x1="50" y1="'+y+'" x2="100" y2="'+y+'" stroke="#d6452d" stroke-width="5"/><text x="162" y="40" font-size="20" font-weight="700" fill="#5d6b52">'+u+'</text>';
  }else if(type==='ruler'){
    vb='0 0 380 150';cls='inst wide';const X=x=>R2(24+332*frac(x));
    b+='<rect class="obj" x="'+X(cfg.min)+'" y="28" width="'+R2(X(v)-X(cfg.min))+'" height="26" rx="2" fill="#f59e0b" stroke="none"/><line x1="'+X(v)+'" y1="18" x2="'+X(v)+'" y2="72" stroke="#d6452d" stroke-width="2" stroke-dasharray="5 4"/>';
    b+='<rect x="10" y="70" width="360" height="62" rx="6" fill="#fff3c4" stroke="#23311f" stroke-width="2.5"/>';
    for(let i=0;i<=n;i++){const xx=X(val(i));b+=tick(i,xx,71,xx,isMaj(i)?96:isMid(i)?88:83);if(isMaj(i))b+=lab(i,xx,112,'middle',cfg.max/cfg.major>12?13:17)}
    b+='<text x="360" y="18" font-size="18" font-weight="700" fill="#5d6b52" text-anchor="end">'+u+'</text>';
  }else{
    vb='0 0 270 270';cls='inst round';const C=135,ang=x=>(120+300*frac(x))*Math.PI/180,P=(r,x)=>[R2(C+r*Math.cos(ang(x))),R2(C+r*Math.sin(ang(x)))];
    b+='<circle cx="135" cy="135" r="130" fill="#fff" stroke="#23311f" stroke-width="5"/>';
    for(let i=0;i<=n;i++){const p=P(isMaj(i)?101:isMid(i)?108:112,val(i)),q=P(124,val(i));b+=tick(i,p[0],p[1],q[0],q[1]);if(isMaj(i)){const l=P(80,val(i));b+=lab(i,l[0],l[1],'middle')}}
    const e=P(116,v);b+='<line class="ndl" x1="135" y1="135" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#d6452d" stroke-width="4" stroke-linecap="round"/><circle cx="135" cy="135" r="9" fill="#23311f"/><text x="135" y="222" font-size="24" font-weight="700" fill="#5d6b52" text-anchor="middle">'+u+'</text>';
  }
  return '<svg class="'+cls+'" viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+TOOLS[type].name+'"><rect x="-200" y="-200" width="900" height="900" fill="#fffbea"/>'+b+'</svg>';
}
const SCALES={
  thermo:[[{min:0,max:20,major:5,minor:1}],
          [{min:0,max:50,major:10,minor:2},{min:0,max:100,major:20,minor:5},{min:0,max:60,major:10,minor:2}],
          [{min:-20,max:30,major:10,minor:2},{min:-10,max:15,major:5,minor:1},{min:34,max:42,major:1,minor:0.2},{min:0,max:120,major:20,minor:4}]],
  cyl:[[{min:0,max:100,major:20,minor:10},{min:0,max:50,major:10,minor:5}],
       [{min:0,max:50,major:10,minor:2},{min:0,max:100,major:20,minor:5},{min:0,max:250,major:50,minor:10}],
       [{min:0,max:25,major:5,minor:0.5},{min:0,max:100,major:10,minor:2},{min:0,max:500,major:100,minor:20}]],
  force:[[{min:0,max:10,major:1,minor:0.5},{min:0,max:20,major:2,minor:1}],

function genRead(type,tier){
  const cfg=one(SCALES[type][tier-1]),n=Math.round((cfg.max-cfg.min)/cfg.minor),per=Math.round(cfg.major/cfg.minor);

function genData(inv){
  /* half-line positions, monotonic, then one odd result */
  for(;;){
    let h=[ri(inv.start[0],inv.start[1])];
    for(let i=0;i<4;i++){const s=inv.curve?inv.steps[i]:ri(inv.steps[0],inv.steps[1]);h.push(h[i]+inv.dir*s)}
    if(h.some(x=>x<1||x>20))continue;
    const a=ri(1,3),cands=[];
    for(let v=1;v<=20;v++){
      if(Math.abs(v-(h[a-1]+h[a+1])/2)<5)continue;
      if(inv.oddMin&&(v<inv.oddMin||v>h[0]))continue;   /* odd value must still be physically possible */
      const g=h.slice();g[a]=v;
      const fits=i=>{const r=g.filter((_,j)=>j!==i);return r.every((x,j)=>!j||(x-r[j-1])*inv.dir>0)};
      if(!fits(a)||[0,1,2,3,4].some(i=>i!==a&&fits(i)))continue;
      if(g.some((x,i)=>i!==a&&x===v))continue;
      cands.push(v);
    }
    if(!cands.length)continue;
    const clean=h.slice();h[a]=one(cands);
    const val=x=>Math.round(x*inv.g/2*100)/100;
    return {xs:inv.iv.xs.slice(),ys:h.map(val),trend:clean.map(val),a};
  }
}

/* ---- answering ---- */
function isRight(t,u){
  if(t.type==='read')return Math.abs(toNum(u)-t.v)<1e-9;
  if(t.type==='sort')return t.cards.every((c,i)=>u[i]===c.r);
  if(t.type==='pick')return !!t.opts[u].ok;
  if(t.type==='anom')return u===t.d.a;
  if(t.type==='plot')return u.c===S.pin&&Math.abs(u.h*t.inv.g/2-t.d.ys[S.pin])<1e-9;
}
function diagnose(t,u){
  if(t.type==='read'){
    const x=toNum(u),m=t.cfg.minor;
    if(t.onLabel)return '';
    if(m!==1&&Math.abs(x-(t.A+t.k))<1e-9)return 'It looks like you counted each small space as 1. Here one space is not 1.';
    if(Math.abs(x+t.v)<1e-9&&t.v!==0)return 'Check the sign: is the mark above or below zero?';
    if(Math.abs(x-t.A)<1e-9||Math.abs(x-t.B)<1e-9)return 'That is a labelled number nearby. The mark is between two labels, so count the small spaces.';
    if(Math.abs(Math.abs(x-t.v)-m)<1e-9)return 'Very close: you are one small space out. Count the spaces, not the lines.';
    return '';
  }
  if(t.type==='sort'){const w=t.cards.map((c,i)=>u[i]===c.r?null:c.t).filter(Boolean);return 'Think again about: '+w.join('; ')+'.'}
  if(t.type==='pick')return t.opts[u].why||'';
  if(t.type==='anom')return t.view==='repeat'?'That value is close to the other repeats.':'That result fits the trend with its neighbours. Look at all of them together.';
  if(t.type==='plot'){const xo=u.c!==S.pin,y=u.h*t.inv.g/2,want=t.d.ys[S.pin];
    if(xo&&Math.abs(y-want)>1e-9)return 'Check both: first the number along the bottom, then the height.';
    if(xo)return 'The height is right, but you are on the line for '+num(t.d.xs[u.c])+' along the bottom.';
    return 'Right column, but your point is '+(y>want?'too high':'too low')+'. It shows '+num(y)+'.'}
}
function answer(u){
  if(!S||S.done)return;const t=S.t;

  const ok=isRight(t,u);S.tries++;
  G.answered++;let gain=0,bonus=0;
  if(ok){
    if(S.tries===1){G.right++;G.row++;if(G.row>G.bestRow)G.bestRow=G.row;if(G.row%5===0)bonus=10;gain=t.type==='plot'?3:t.type==='sort'?10:6+(t.type==='read'?t.tier:0)}
    else gain=t.type==='plot'?1:3;
  }else{S.miss++;G.row=0}
  const reveal=!ok&&S.tries>=2;
  let more=false;
  if(t.type==='plot'&&(ok||reveal)){S.pin++;more=S.pin<5}
  const taskOver=(ok||reveal)&&!more;
  if(taskOver){
    const l=LV[S.n-1],clean=ok&&S.tries===1&&!S.failed;
    if(l.adapt&&!S.forceTier){if(clean){G.up[S.n]=(G.up[S.n]||0)+1;if(G.up[S.n]>=2){G.tiers[S.n]=Math.min(3,tierNow()+1);G.up[S.n]=0}}else{G.up[S.n]=0;if(reveal)G.tiers[S.n]=Math.max(1,tierNow()-1)}}

  S.xp+=gain+bonus;saveG();if(gain+bonus)addQuizXp(gain+bonus);touchDay();

/* =====================================================================

   Part 1: verifier that recomputes every answer by another route (reads the

   Part 2: plays every level through the real controls, with right, wrong and

const V={
  parse(svg){const d=new DOMParser().parseFromString(svg,'image/svg+xml');if(d.querySelector('parsererror'))throw new Error('bad svg');return d},
  /* read an instrument drawing: map positions of the printed numbers to the mark */
  read(svg,tool){
    const d=V.parse(svg),A=e=>n=>+e.getAttribute(n);
    let pos,labs;const L=[...d.querySelectorAll('.lb')].map(e=>({v:toNum(e.textContent),x:A(e)('x'),y:A(e)('y')}));
    const ticks=[...d.querySelectorAll('.tk')].map(e=>({x1:A(e)('x1'),y1:A(e)('y1'),x2:A(e)('x2'),y2:A(e)('y2')}));
    const el=s=>{const e=d.querySelector(s);if(!e)throw new Error('no '+s);return A(e)};
    let tp;
    if(tool==='thermo'){pos=el('.liq')('y');labs=L.map(l=>[l.y,l.v]);tp=ticks.map(t=>t.y1)}
    else if(tool==='force'){pos=el('.ptr')('y1');labs=L.map(l=>[l.y,l.v]);tp=ticks.map(t=>t.y1)}
    else if(tool==='cyl'){const m=d.querySelector('.men').getAttribute('d').match(/-?\d+(\.\d+)?/g).map(Number);pos=.25*m[1]+.5*m[3]+.25*m[5];labs=L.map(l=>[l.y,l.v]);tp=ticks.map(t=>t.y1)}
    else if(tool==='ruler'){const o=el('.obj');pos=o('x')+o('width');labs=L.map(l=>[l.x,l.v]);tp=ticks.map(t=>t.x1)}
    else{const ang=(x,y)=>(Math.atan2(y-135,x-135)*180/Math.PI-110+720)%360;const n=el('.ndl');pos=ang(n('x2'),n('y2'));labs=L.map(l=>[ang(l.x,l.y),l.v]);tp=ticks.map(t=>ang(t.x2,t.y2))}
    labs.sort((a,b)=>a[1]-b[1]);const [p1,v1]=labs[0],[p2,v2]=labs[labs.length-1];
    const val=v1+(pos-p1)*(v2-v1)/(p2-p1);
    /* every printed number must be evenly placed, and the mark must sit on a tick */
    for(const [p,v] of labs)if(Math.abs(v1+(p-p1)*(v2-v1)/(p2-p1)-v)>(v2-v1)*.002)throw new Error('labels uneven '+v);
    const near=Math.min(...tp.map(t=>Math.abs(t-pos)));if(near>(tool==='dial'?.35:.06))throw new Error('mark not on a tick '+near);

  /* the only index that takes part in every pair that goes the wrong way */
  odd(ys,dir){const inv=[];for(let i=0;i<ys.length;i++)for(let j=i+1;j<ys.length;j++)if((ys[j]-ys[i])*dir<=0)inv.push([i,j]);if(inv.length<2)return -1;const c=ys.map((_,k)=>k).filter(k=>inv.every(p=>p.includes(k)));return c.length===1?c[0]:-1},
  data(inv,d){const E=[];if(d.ys.length!==5||d.xs.join()!==inv.iv.xs.join())E.push('data shape');
    for(const y of d.ys){const h=y/(inv.g/2);if(Math.abs(h-Math.round(h))>1e-6||y<=0||h>20)E.push('value off grid '+y);if(y<inv.scale.min||y>inv.scale.max||Math.abs((y-inv.scale.min)/inv.scale.minor-Math.round((y-inv.scale.min)/inv.scale.minor))>1e-6)E.push('value off instrument scale '+inv.id+' '+y)}
    if(V.odd(d.ys,inv.dir)!==d.a)E.push('odd result not unique '+inv.id+' '+d.ys);
    const mid=(d.ys[d.a-1]+d.ys[d.a+1])/2;if(!(d.a>0&&d.a<4)||Math.abs(d.ys[d.a]-mid)<inv.g*2.4)E.push('odd result not obvious '+inv.id+' '+d.ys);
    return E},
  graph(inv,d){const g=V.parse(graphSVG(inv,d));const yl=[...g.querySelectorAll('.ylb')].map(e=>[+e.getAttribute('y'),toNum(e.textContent)]),xl=[...g.querySelectorAll('.xlb')].map(e=>[+e.getAttribute('x'),toNum(e.textContent)]);
    const paths=[...g.querySelectorAll('path')].filter(p=>p.getAttribute('stroke')==='#14532d').map(p=>{const m=p.getAttribute('d').match(/-?\d+(\.\d+)?/g).map(Number);return [m[0]+6,m[1]+6]});
    if(paths.length!==5||xl.length!==5||yl.length!==6)return ['graph parts '+paths.length+' '+xl.length+' '+yl.length];
    const [a,b]=[yl[0],yl[yl.length-1]];
    return paths.some((p,i)=>{const y=a[1]+(p[1]-a[0])*(b[1]-a[1])/(b[0]-a[0]);return Math.abs(p[0]-xl[i][0])>.1||xl[i][1]!==d.xs[i]||Math.abs(y-d.ys[i])>inv.g*.02})?['graph point wrong '+inv.id]:[]},
  UNIT:{'thermometer':['°C','temperature'],'measuring cylinder':['ml','volume'],'force meter':['N','force'],'ruler or tape measure':['cm','length'],'stopwatch':['s','time'],'sound level meter':['dB','loudness'],'balance (scales)':['g','mass']},
  WORDS:{thermometer:/temperature/,'measuring cylinder':/volume/,'force meter':/force|pull|newtons/,'ruler or tape measure':/length|far|height|distance/,stopwatch:/time|long/,'sound level meter':/loud|noise/,'balance (scales)':/mass/},
  check(t){
    const E=[];const txt=[t.instr,t.ru,t.q||''].concat(t.hint||[],t.sol||[],(t.opts||[]).map(o=>o.t+(o.why||'')),(t.cards||[]).map(c=>c.t));
    if(txt.some(s=>/NaN|undefined|Infinity|\[object|\d\.\d{4,}/.test(s)))E.push('bad text '+t.instr);
    if(txt.some(s=>/\u0451|\u2014|\u2013/.test(s)))E.push('forbidden character '+t.instr);
    if(!t.ru||!t.gl||!t.gl.length)E.push('no translation');
    if(t.type!=='plot'&&(!t.hint||!t.sol))E.push('no method');
    try{
      if(t.type==='read'){
        const r=V.read(instSVG(t.tool,t.cfg,t.v),t.tool);
        if(Math.abs(r.val-t.v)>t.cfg.minor*.04)E.push('reading '+t.tool+' '+r.val+' != '+t.v+' '+JSON.stringify(t.cfg));
        if(Math.abs(r.step-t.cfg.minor)>1e-6)E.push('tick step '+r.step);
        const steps=(t.v-t.A)/t.cfg.minor;if(Math.abs(steps-t.k)>1e-6||t.k<0||t.A>t.v||t.B<t.v||Math.abs(t.A+t.k*t.cfg.minor-t.v)>1e-6)E.push('method numbers');
        if(!t.sol[t.sol.length-1].includes('<b>'+num(t.v)+' '))E.push('method end');
        if(Math.abs(toNum(num(t.v))-t.v)>1e-9||num(t.v).length>7)E.push('not typeable '+t.v);
        if(t.v!==t.cfg.minor&&t.hint.join().includes('<b>'+num(t.v)+' '+t.unit))E.push('hint gives the answer');
        if(t.onLabel!==(Math.abs(t.v%t.cfg.major)<1e-6||Math.abs(Math.abs(t.v%t.cfg.major)-t.cfg.major)<1e-6))E.push('label flag '+t.v+' '+t.cfg.major);
        if(t.inv){if(t.d.ys[t.row]!==t.v)E.push('case reading row')}
      }else if(t.type==='sort'){
        const c=r=>t.cards.filter(x=>x.r===r);
        if(t.cards.length!==5||c('iv').length!==1||c('dv').length!==1||c('cv').length!==3)E.push('card counts');
        if(new Set(t.cards.map(x=>x.t)).size!==5)E.push('duplicate card');
        /* the question reads "Does A change B": A must match the changed card, B the measured card */
        const m=/^Does (.+?) (?:change|affect) (.+)\?$/.exec(t.q);if(!m)E.push('question pattern '+t.q);else{
          const key=s=>s.toLowerCase().split(/\W+/).filter(w=>w.length>3&&!/^(since|start|taken|takes|after|shown|reading|needed|round|from|used|inside|left|time|water|height|type|volume|temperature|mass|distance)$/.test(w));
          const score=(card,part)=>card.toLowerCase().split(/\W+/).filter(w=>w.length>2&&!/^(the|and|for)$/.test(w)&&part.toLowerCase().includes(w.replace(/s$/,''))).length;
          const iv=c('iv')[0].t,dv=c('dv')[0].t;
          if(!(score(iv,m[1])>=1))E.push('changed card not in question: '+iv+' | '+t.q);
          if(!(score(dv,m[2]+(t.q.includes('time that passes')?' time':''))>=1))E.push('measured card not in question: '+dv+' | '+t.q)}
      }else if(t.type==='pick'){
        if(t.opts.length!==4||new Set(t.opts.map(o=>o.t)).size!==4)E.push('options '+t.instr);
        if(t.opts.filter(o=>o.ok).length!==1)E.push('exactly one');
        if(t.opts.some(o=>!o.ok&&!o.why))E.push('no reason');
        const ok=t.opts.find(o=>o.ok);
        if(t.sub==='concl'){
          let s=0;const ys=t.d.ys.filter((_,i)=>i!==t.d.a);for(let i=1;i<ys.length;i++)s+=Math.sign(ys[i]-ys[i-1]);
          if(Math.abs(s)!==3)E.push('trend not clear');
          const real=Math.sign(s);const good=t.opts.filter(o=>o.claim===real);if(good.length!==1||good[0]!==ok)E.push('conclusion direction '+t.inv.id);
          E.push(...V.data(t.inv,t.d),...V.graph(t.inv,t.d));
        }else if(t.sub==='pred'){
          const xs=t.d.xs;let i=0;while(xs[i+1]<t.x)i++;const lo=Math.min(t.d.ys[i],t.d.ys[i+1]),hi=Math.max(t.d.ys[i],t.d.ys[i+1]);
          if(i===t.d.a||i+1===t.d.a||!(xs[i]<t.x&&t.x<xs[i+1]))E.push('prediction next to odd result');
          const good=t.opts.filter(o=>o.v>lo&&o.v<hi);if(good.length!==1||good[0]!==ok)E.push('prediction '+t.inv.id+' '+t.opts.map(o=>o.v)+' '+lo+' '+hi);
          if(t.opts.some(o=>o.v<=0||toNum(o.t.split(' ')[0])!==o.v))E.push('prediction value text');
        }else if(t.sub==='tool'){
          const what=(t.thing||t.inv.dv.name);const m=Object.keys(V.WORDS).filter(n=>V.WORDS[n].test(what));
          if(!m.includes(ok.t.toLowerCase()))E.push('tool '+what+' '+ok.t);
          if(t.opts.filter(o=>!o.ok).some(o=>{const n=o.t.toLowerCase(),u=t.inv?t.inv.dv.unit:null;return u&&V.UNIT[n][0]===u}))E.push('second right tool '+what);
          if(t.inv&&V.UNIT[ok.t.toLowerCase()][0]!==t.inv.dv.unit)E.push('tool unit '+what);
        }else if(t.sub==='unit'){
          const n=Object.keys(V.UNIT).find(n=>t.instr.includes('a '+n+'?'));if(!n||V.UNIT[n][0]!==ok.t)E.push('unit '+t.instr);
        }else if(t.sub==='fair'){if(!/fair/.test(ok.t))E.push('fair');if(!t.inv.cv.includes(t.cv))E.push('not a control')}
        else if(t.sub==='fix'){if(!FIXQ.some(f=>f[0]===t.instr&&f[1][0]===ok.t))E.push('fix')}
        else E.push('unknown pick');
      }else if(t.type==='anom'){
        if(t.view==='repeat'){const v=t.rep.vals,s=v.slice().sort((a,b)=>a-b),med=s[2],dev=v.map(x=>Math.abs(x-med)),big=Math.max(...dev),rest=dev.filter((_,i)=>i!==t.d.a);
          if(dev[t.d.a]!==big||Math.max(...rest)*2.4>big||v.some(x=>x<=0))E.push('repeat odd '+v)}
        else E.push(...V.data(t.inv,t.d),...V.graph(t.inv,t.d));
      }else if(t.type==='plot')E.push(...V.data(t.inv,t.d),...V.graph(t.inv,t.d));
    }catch(e){E.push('exception '+e.message+' '+t.instr)}
    return E;
  }
};
function runSelftest(){
  const errs=[],seen=new Set();let items=0,played=0,wrongPaths=0;
  const bad=m=>{if(errs.length<40&&!errs.includes(m))errs.push(m)};
  try{
    /* verifier sanity */
    const br=genRead('cyl',2);br.v+=br.cfg.minor;if(!V.check(br).length)bad('verifier accepted wrong reading');
    if(V.odd([1,2,9,4,5],1)!==2||V.odd([1,2,3,4,5],1)!==-1)bad('odd sanity');
    const add=t=>{items++;seen.add(sig(t));V.check(t).forEach(bad)};
    for(const k in SCALES)for(let tier=1;tier<=3;tier++){for(let i=0;i<110;i++)add(genRead(k,tier));
      for(const cfg of SCALES[k][tier-1]){const n=Math.round((cfg.max-cfg.min)/cfg.minor);for(let i=0;i<=n;i++)add(readTask(k,cfg,Math.round((cfg.min+i*cfg.minor)*100)/100,tier))}}
    for(let r=0;r<40;r++)for(const inv of INV){caseTasks(inv).forEach(add);add(anomTable(inv,genData(inv)))}
    for(const inv of INV.concat(VAR_EXTRA))for(let i=0;i<4;i++)add(sortTask(inv));
    for(let i=0;i<300;i++)add(toolBench());for(let i=0;i<120;i++)add(anomRepeat());for(let i=0;i<3;i++)add(fixTask(i));
    if(seen.size<1200)bad('little variation '+seen.size);
    /* ---- play through the real controls ---- */
    const click=s=>{const b=$(s);if(!b)throw new Error('no element '+s);if(b.disabled)throw new Error('disabled '+s);b.dispatchEvent(new MouseEvent('click',{bubbles:true}))};
    const type=s=>{while(S.buf)click('[data-k="⌫"]');const neg=s.startsWith('−');for(const c of neg?s.slice(1):s)click('[data-k="'+c+'"]');if(neg)click('[data-k="−"]');if(S.buf!==s)throw new Error('typed '+S.buf+' not '+s);click('[data-k="OK"]')};
    const tapGraph=(c,h)=>{const svg=$('#graph'),m=svg.getScreenCTM(),p=svg.createSVGPoint();p.x=gx(c)+7;p.y=gy(h)+3;const q=p.matrixTransform(m);svg.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:q.x,clientY:q.y}))};
    let wrongSel=0;
    const act=right=>{
      const t=S.t;
      if(t.type==='read')type(right?num(t.v):num(t.v+t.cfg.minor*(t.v<t.cfg.max?1:-1)));
      else if(t.type==='sort'){t.cards.forEach((c,i)=>{const r=right?c.r:(c.r==='iv'?'dv':c.r==='dv'?'iv':'cv');click('[data-c="'+i+'"][data-r="'+r+'"]')});click('#check')}
      else if(t.type==='pick'){const i=t.opts.findIndex((o,j)=>right?o.ok:!o.ok&&!$('[data-o="'+j+'"]').disabled);click('[data-o="'+i+'"]')}
      else if(t.type==='anom'){const i=right?t.d.a:[0,1,2,3,4].filter(i=>i!==t.d.a)[wrongSel++%4];click(t.view==='graph'?'.pt[data-p="'+i+'"]':'tr[data-r="'+i+'"] td')}
      else{const j=S.pin,h=Math.round(t.d.ys[j]/(t.inv.g/2)),wh=right?h:(h>10?h-3:h+3);
        if(j%2===0){tapGraph(j,wh);if(!S.mark||S.mark.c!==j||S.mark.h!==wh)throw new Error('tap snapped to '+JSON.stringify(S.mark)+' wanted '+j+','+wh)}
        else{click('[data-n="0,1"]');let g=0;while(S.mark.c<j&&g++<30)click('[data-n="1,0"]');while(S.mark.c>j&&g++<30)click('[data-n="-1,0"]');while(S.mark.h<wh&&g++<60)click('[data-n="0,1"]');while(S.mark.h>wh&&g++<90)click('[data-n="0,-1"]')}
        click('#check')}
    };
    const solve=mode=>{ /* mode 0: right, 1: wrong then right, 2: wrong twice */
      const t=S.t,i=S.i;let guard=0;
      while(!S.done&&guard++<20){
        const pin=S.pin;
        if(mode>0){act(false);wrongPaths++;const fb=$('#fb');
          if(!fb||!fb.classList.contains('bad')||!fb.querySelector('ol li'))bad('no method after mistake '+t.type);
          if(S.done||S.pin!==pin)bad('first mistake ended the task '+t.type);
          const html=fb.innerHTML;
          if(t.type==='read'&&t.v!==t.cfg.minor&&fb.textContent.includes('= '+num(t.v)+' '))bad('clue reveals reading');
          if(mode===2){act(false);const f2=$('#fb');if(!f2||!f2.classList.contains('bad')||!f2.querySelector('ol li'))bad('no solution after second mistake '+t.type);if(t.type!=='plot'&&!S.done)bad('second mistake did not finish '+t.type);if(t.type==='plot'&&!S.done&&S.pin!==pin+1)bad('plot not pinned after two mistakes');played+=2}
          else{act(true);played+=2}
        }else{act(true);played++;if($('#fb').classList.contains('bad'))throw new Error('right answer rejected '+t.type+' '+t.instr+' '+t.v)}
      }
      if(!S.done||!$('#next'))throw new Error('task not finished '+t.type);
    };
    loadG();
    for(let n=1;n<=LV.length;n++){
      for(const mode of [0,1,2]){
        G.stars={};G.tiers={};G.up={};G.row=0;const xp0=jget(QKEY).xp||0;
        start(n);let guard=0,top=1;
        while(!S.finished&&guard++<30){const t=S.t;if(t.type==='read')top=Math.max(top,t.tier);V.check(t).forEach(bad);solve(mode);click('#next')}
        if(!S.finished||!$('#done'))bad('level '+n+' not finished');
        else if(mode===0&&(S.finished.stars!==3||G.stars[n]!==3))bad('stars L'+n);
        else if(mode===2&&S.finished.stars!==1)bad('stars with mistakes L'+n);
        if(mode===0&&LV[n-1].adapt&&top<3)bad('level '+n+' never got hard');
        if(mode===2&&!LV[n-1].case&&S.total!==LV[n-1].n+3)bad('no twin tasks L'+n);
        if(!((jget(QKEY).xp||0)>xp0))bad('no xp L'+n);
      }
    }
    /* every tier of every reading bench, wrong paths included */
    for(let n=1;n<=4;n++)for(let tier=1;tier<=3;tier++){start(n,{tier});for(let i=0;i<6;i++){solve(i%3);click('#next')}}
    /* double answer is ignored */
    start(5);act(true);const x1=jget(QKEY).xp;answer(0);if(jget(QKEY).xp!==x1)bad('double answer');
    /* map and storage rules */
    showMap();if(document.querySelectorAll('[data-lv]').length!==LV.length)bad('map');
    for(const k in MEM)delete MEM[k];
    MEM[QKEY]=JSON.stringify({xp:5,best:{boss:80},mist:{a:1}});MEM[PKEY]=JSON.stringify({day:yesterday(),streak:3});loadG();
    start(1);act(true);
    const q=JSON.parse(MEM[QKEY]),g=JSON.parse(MEM[GKEY]),p=JSON.parse(MEM[PKEY]);
    if(q.xp!==5+S.xp||q.best.boss!==80||!q.mist||Object.keys(q).length!==3)bad('quiz record merge');
    if('xp' in g||g.answered!==1)bad('game record');if(p.streak!==4||p.day!==dayStr(new Date()))bad('streak');
    click('#next');act(true);if(JSON.parse(MEM[PKEY]).streak!==4)bad('streak twice a day');
    delete MEM[QKEY];click('#next');act(true);if(!(JSON.parse(MEM[QKEY]).xp>0))bad('create quiz record');
    MEM[QKEY]='not json';click('#next');act(true);if(MEM[QKEY]!=='not json')bad('corrupt record overwritten');
  }catch(e){bad('exception: '+e.message+' '+String(e.stack).split('\n')[1])}
  if(items<2000)bad('too few items '+items);
  const msg=errs.length?'GAME_SELFTEST_FAIL '+errs.join(' ; '):'GAME_SELFTEST_OK levels='+LV.length+' verified='+items+' distinct='+seen.size+' wrongPaths='+wrongPaths+' played='+played;
  document.body.innerHTML='<pre id="selftest" style="color:#fff;white-space:pre-wrap">'+esc(msg)+'</pre>';
}

/* ---------- boot ---------- */
loadG();
if(SELFTEST)runSelftest();
else{
  const n=+QS.get('level');
  if(n>=1&&n<=LV.length){
    start(n,{tier:+QS.get('tier')||0,step:+QS.get('step')||0});
    const show=QS.get('show');
    if(show==='done'){S.i=S.total;finish()}
    else if(show){
      const t=S.t,right=show==='right';
      const u=()=>t.type==='read'?(right?num(t.v):num(t.A+t.k)===num(t.v)?num(t.B):num(t.A+t.k)):t.type==='sort'?Object.fromEntries(t.cards.map((c,i)=>[i,right?c.r:(c.r==='iv'?'dv':c.r==='dv'?'iv':'cv')])):t.type==='pick'?t.opts.findIndex((o,j)=>right?o.ok:!o.ok&&!$('[data-o="'+j+'"]').disabled):t.type==='anom'?(right?t.d.a:(t.d.a+1)%5):{c:S.pin,h:Math.round(t.d.ys[S.pin]/(t.inv.g/2))-(right?0:3)};
      if(t.type==='sort'&&!right){const x=u();for(const i in x){const b=$('[data-c="'+i+'"][data-r="'+x[i]+'"]');b.click()}}
      if(t.type==='plot'){if(show==='mark'){const x=u();tapAt(gx(x.c),gy(x.h+3))}else if(right){answer(u());answer(u());const x=u();tapAt(gx(x.c),gy(x.h))}else{S.mark=u();drawMark();answer(u());if(show==='solution'){answer(u())}}}
      else{answer(u());if(show==='solution'&&!S.done)answer(u())}
    }
  }else showMap();
}
