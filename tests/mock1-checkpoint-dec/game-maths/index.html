<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mango Climb - no-calculator maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--bg:#0f3d2a;--card:#fffbea;--ink:#23311f;--soft:#5d6b52;--line:#c9d8a8;--brand:#e8710a;--brand2:#f59e0b;--tint:#ecf6cf;
--good:#2e9e4a;--goodbg:#dff4d2;--bad:#d6452d;--badbg:#fde1d8;--warn:#e8a200;--warnbg:#fdf0c4;
--font:"Fredoka","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 12% 18%,rgba(163,230,53,.18) 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,rgba(34,197,94,.2) 0 90px,transparent 91px),radial-gradient(circle at 40% 92%,rgba(250,204,21,.12) 0 70px,transparent 71px);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:14px 14px 40px}
.btn{font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:20px;box-shadow:0 5px 0 #9a4a05;min-height:52px;min-width:52px;padding:10px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a4a05}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:30px;padding:6px 12px;font-weight:600;font-size:16px;white-space:nowrap}
h1{color:#fffbea;font-size:34px;margin:18px 0 4px;line-height:1.15}
.sub{color:#cfe8c4;margin:0 0 14px}
.card{background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.25);padding:14px 16px}
details.ru{margin-top:6px;font-size:16px}
details.ru summary{cursor:pointer;font-weight:600;color:#9a4a05;list-style:none;padding:6px 0;min-height:36px}
details.ru summary::-webkit-details-marker{display:none}
details.ru summary::before{content:"▸ "}
details.ru[open] summary::before{content:"▾ "}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gl span{background:var(--tint);border-radius:12px;padding:3px 9px;font-size:15px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.lv{position:relative;text-align:left;background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 7px 0 rgba(0,0,0,.25);padding:12px;min-height:146px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lv:active{transform:translateY(3px)}
.lv .ico{font-size:34px;line-height:1.1}
.lv .nm{font-weight:700;line-height:1.2}
.lv .ds{font-size:14px;color:var(--soft);line-height:1.25}
.lv .st{margin-top:auto;color:var(--brand2);font-size:22px;letter-spacing:2px}
.lv .st i{font-style:normal;color:#d9dec6}
.lv .res{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;background:var(--warnbg);border-radius:10px;padding:2px 7px}
.lv.boss{background:linear-gradient(120deg,#d9f99d,#86efac);grid-column:span 2}
/* play */
.ptop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ptop .btn{min-height:48px;padding:6px 14px;font-size:16px}
.ptitle{flex:1;min-width:0;color:#fffbea;font-weight:700;line-height:1.15;font-size:17px}
.ptitle small{display:block;color:#cfe8c4;font-weight:600;font-size:13px}
.vine{position:relative;height:44px;margin:0 0 10px;background:rgba(255,251,234,.12);border-radius:22px;padding:0 6px}
.vine .rail{position:absolute;left:24px;right:54px;top:19px;height:6px;border-radius:4px;background:#2f6b45}
.vine .fill{position:absolute;left:0;top:0;bottom:0;background:#a3e635;border-radius:4px;transition:width .5s}
.vine .dot{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fffbea}
.vine .dot.on{background:#a3e635}
.vine .monkey{position:absolute;top:-18px;margin-left:-17px;font-size:30px;line-height:1.3;transition:left .5s}
.vine .goal{position:absolute;right:7px;top:3px;font-size:28px;line-height:38px}
.vine.slip .monkey{animation:slip .5s}
@keyframes slip{25%{transform:translateY(8px) rotate(-18deg)}60%{transform:translateY(-3px) rotate(12deg)}}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.qcard{text-align:center;min-width:0}
.qcard .tag{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--soft)}
.qcard .tag b{color:var(--brand2);letter-spacing:2px;font-size:16px}
.qcard .instr{font-weight:600;font-size:20px;margin:6px 0 2px;line-height:1.3}
.qcard .story{font-size:20px;font-weight:600;margin:6px 0;line-height:1.35}
.math{font-weight:700;font-size:40px;margin:8px 0 4px;line-height:1.5;overflow-wrap:anywhere}
.math.long{font-size:32px}
.qcard details.ru{text-align:left}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;margin:0 .1em;font-size:.82em}
.fr i{font-style:normal;padding:0 .18em;min-width:.9em;text-align:center}
.fr i+i{border-top:.1em solid currentColor}
.mx{white-space:nowrap}
.box{display:inline-block;width:1.1em;height:1.1em;border:4px dashed var(--brand);border-radius:10px;vertical-align:-.18em}
.answer{min-width:0}
.disp{background:#fff;border:4px solid var(--brand);border-radius:20px;min-height:68px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;font-weight:700;margin-bottom:10px;padding:2px 10px}
.disp .ph{color:#b9c3a4;font-size:20px;font-weight:600}
.disp .unit{color:var(--soft);font-size:24px}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{min-height:56px;border:0;border-radius:18px;background:var(--card);font-size:26px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.28);user-select:none;-webkit-user-select:none}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.key:disabled{opacity:.25;cursor:default;transform:none}
.key.fn{background:var(--tint);font-size:22px}
.key.ok{background:var(--brand);color:#fff;box-shadow:0 5px 0 #9a4a05}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{min-height:68px;border:4px solid var(--line);border-radius:20px;background:var(--card);font-size:26px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25);padding:6px;min-width:0;line-height:1.35;position:relative}
.opt.sel{background:#ffe8b0;border-color:var(--brand)}
.opt .n{position:absolute;top:-8px;left:-6px;background:var(--brand);color:#fff;border-radius:50%;width:28px;height:28px;font-size:16px;line-height:28px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.wide{width:100%;margin-top:12px;font-size:21px;min-height:60px}
.chart{background:var(--card);border-radius:22px;border:4px solid var(--line);padding:8px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 16px repeat(3,minmax(0,1fr));gap:3px;text-align:center}
.cols .hd{font-size:13px;font-weight:700;background:var(--tint);border-radius:8px;padding:4px 0;line-height:1.1}
.cols .dg{font-size:32px;font-weight:700;min-height:56px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:10px;background:#fff}
.cols .dg.zero{color:#a8b392}
.cols .pt{font-size:36px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;line-height:1.2}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.arrows .btn{min-height:62px}
.fb{border:4px solid var(--good);background:var(--goodbg);border-radius:26px;padding:12px 16px;text-align:left}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb h2{margin:0 0 4px;font-size:22px}
.fb .cmpans{font-weight:600;margin:2px 0}
.fb .trap{background:var(--warnbg);border-radius:14px;padding:8px 10px;margin:8px 0;font-weight:600}
.fb ol{margin:6px 0;padding-left:24px}
.fb li{margin:5px 0}
.fb .act{position:sticky;bottom:8px;margin-top:10px}
.fb .act .btn{width:100%;font-size:20px}
.done{text-align:center;max-width:560px;margin:24px auto}
.done .big{font-size:60px;color:var(--brand2);letter-spacing:6px}
.done .big i{font-style:normal;color:#d9dec6}
.done .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
@media (max-width:380px){.cols .dg{font-size:26px}.math{font-size:34px}}
@media (max-width:600px){.fb{font-size:17px}.map{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chip{font-size:14px;padding:5px 9px}.top .btn{padding:6px 14px}}
@media (min-width:700px) and (max-width:899px){.math{font-size:52px}.key{min-height:72px;font-size:30px}.qcard{padding:22px}}
@media (min-width:900px){.pgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.math{font-size:48px}.math.long{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* =====================================================================
   Mango Climb - non-calculator maths practice. Everything is generated.
   Storage (every access guarded):
     'sq:mock1-checkpoint-dec'  quiz record; the game only adds to "xp"
     'sq:profile'               shared daily streak {day, streak}
     'sq:game:mango-climb'      game progress (no "xp" field)
   QA: ?level=1..11 [&tier=1..3] [&kind=id] [&seed=n] [&show=wrong|right|done]
       ?selftest
   ===================================================================== */
'use strict';
const QS=new URLSearchParams(location.search), SELFTEST=QS.has('selftest');
const GKEY='sq:game:mango-climb', QKEY='sq:mock1-checkpoint-dec', PKEY='sq:profile';

/* ---------- random ---------- */
let seed=QS.has('seed')?(+QS.get('seed')>>>0):(SELFTEST?20261126:((Date.now()^(Math.random()*1e9))>>>0));
function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const one=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickN=(a,n)=>shuffle(a).slice(0,n);

/* ---------- number helpers (integer arithmetic only) ---------- */
function dec(n,p){ /* n / 10^p as a tidy string */
  const neg=n<0;n=Math.abs(n);if(p<0){n*=Math.pow(10,-p);p=0}
  let s=String(n);if(p>0){while(s.length<=p)s='0'+s;s=s.slice(0,-p)+'.'+s.slice(-p);s=s.replace(/0+$/,'').replace(/\.$/,'')}
  return (neg&&s!=='0'?'−':'')+s;
}
function padp(s,p){if(!p)return s;let [a,b='']=s.split('.');while(b.length<p)b+='0';return a+'.'+b}
const P10=p=>Math.pow(10,p);
function nz(a,b){let n;do{n=ri(a,b)}while(n%10===0);return n}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
const lcm=(a,b)=>a*b/gcd(a,b);
function fstr(n,d){const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d}
function mixed(n,d){const g=gcd(n,d);n/=g;d/=g;if(d===1)return String(n);return n>d?Math.floor(n/d)+' '+(n%d)+'/'+d:n+'/'+d}
const E=s=>'{'+s+'}';
const signed=n=>n<0?'−'+(-n):String(n);

/* ---------- exact value of a typed answer (game side) ---------- */
function typedVal(s){
  s=String(s).trim().replace(/−/g,'-');let m;
  if((m=/^(-?)(\d+)(?:\.(\d*))?$/.exec(s))){const f=m[3]||'';return {n:(m[1]?-1:1)*Number(m[2]+f),d:P10(f.length),plain:true}}
  if((m=/^(?:(\d+) )?(\d+)\/(\d+)$/.exec(s))){const w=+(m[1]||0),a=+m[2],b=+m[3];if(!b)return null;if(m[1]!==undefined&&a>=b)return {n:w*b+a,d:b,frac:true,badMixed:true};return {n:w*b+a,d:b,frac:true,a:a,b:b}}
  return null;
}
const same=(x,y)=>!!x&&!!y&&x.n*y.d===y.n*x.d;

/* =====================================================================
   GENERATORS. Each returns an item:
   {type, q, story?, math?, unit?, ans, opts?, how:[...], rule, traps?, v}
   ===================================================================== */
const K={};
function kind(id,tiers,ru,gl,rule,fn){K[id]={id,tiers,ru,gl,rule,fn}}

/* ---- 1 place value ---- */
function pvNumbers(t){
  for(;;){
    const sig=t===1?ri(2,99):t===2?nz(11,999):nz(101,9999);
    const p=t===1?ri(0,1):t===2?ri(0,2):ri(0,3);
    const e=t===1?ri(1,2):ri(1,3);
    const mul=rnd()<.5, np=mul?p-e:p+e;
    if(np>3||sig*P10(-Math.min(np,0))>=10000||sig/P10(p)>=10000)continue;
    return {sig,p,e,mul,np,a:dec(sig,p),r:dec(sig,np),f:P10(e),op:mul?'×':'÷'};
  }
}
function pvHow(x){
  const h=[(x.mul?'× makes the number bigger: every digit moves to the LEFT.':'÷ makes the number smaller: every digit moves to the RIGHT.')+' '+x.f+' has '+x.e+' zero'+(x.e>1?'s':'')+', so move '+x.e+' place'+(x.e>1?'s':'')+'.'];
  if(x.e>1){let cur=x.a;for(let i=1;i<=x.e;i++){const nxt=dec(x.sig,x.p+(x.mul?-i:i));h.push('Place '+i+': '+E(cur+' '+x.op+' 10 = '+nxt));cur=nxt}}
  h.push('Answer: '+E(x.a+' '+x.op+' '+x.f+' = '+x.r));
  return h;
}
function pvTraps(x){
  const t=[];
  for(const k of [1,2,3,4]){if(k!==x.e)t.push({v:dec(x.sig,x.p+(x.mul?-k:k)),m:'You moved the digits '+k+' place'+(k>1?'s':'')+'. For '+x.op+' '+x.f+' you need exactly '+x.e+'.'});t.push({v:dec(x.sig,x.p+(x.mul?k:-k)),m:'Wrong direction. '+(x.mul?'Multiplying by '+x.f+' must give a BIGGER number.':'Dividing by '+x.f+' must give a SMALLER number.')})}
  return t;
}
const PVRULE='× 10, 100, 1000: цифры сдвигаются влево на 1, 2, 3 разряда. ÷ - вправо. Пустые разряды заполняем нулями.';
kind('pv-shift',[1,2,3],'Передвинь цифры в таблице разрядов так, чтобы получился ответ. Потом нажми Check.',[['digit','цифра'],['place','разряд'],['tenths','десятые'],['hundredths','сотые'],['thousandths','тысячные']],PVRULE,t=>{
  const x=pvNumbers(t);
  return {type:'shift',q:'Move the digits to show the answer.',math:x.a+' '+x.op+' '+x.f,ans:x.mul?x.e:-x.e,answerText:x.r,orig:x.a,sig:x.sig,p:x.p,how:pvHow(x),v:{t:'shift',orig:x.a}};
});
kind('pv-type',[1,2,3],'Вычисли и набери ответ.',[['work out','вычисли']],PVRULE,t=>{
  const x=pvNumbers(t);
  return {type:'num',q:'Work out.',math:x.a+' '+x.op+' '+x.f,ans:x.r,how:pvHow(x),traps:pvTraps(x),v:{t:'eval'}};
});
kind('pv-missing',[2,3],'Какое число должно стоять в рамке?',[['goes in the box','стоит в рамке']],PVRULE,t=>{
  const x=pvNumbers(t);
  return {type:'pick',cols:'three',q:'Which number goes in the box?',math:x.a+' '+x.op+' □ = '+x.r,opts:['10','100','1000'],ans:x.e-1,
    how:['Compare where the first digit was and where it is now: it moved '+x.e+' place'+(x.e>1?'s':'')+'.',x.e+' place'+(x.e>1?'s':'')+' means '+x.f+'. Check: '+E(x.a+' '+x.op+' '+x.f+' = '+x.r)],v:{t:'missing'}};
});
const PLACES=[[3,'thousands'],[2,'hundreds'],[1,'tens'],[0,'ones'],[-1,'tenths'],[-2,'hundredths'],[-3,'thousandths']];
kind('pv-digit',[1,2,3],'Чему равна эта цифра (ее значение по разряду)?',[['value','значение'],['digit','цифра'],['tens','десятки'],['tenths','десятые'],['hundredths','сотые'],['thousandths','тысячные']],'Значение цифры зависит от места: после точки идут десятые, сотые, тысячные.',t=>{
  const p=t===1?1:t===2?2:3, w=t===1?2:t===2?2:ri(2,3);
  const ds=pickN([1,2,3,4,5,6,7,8,9],p+w);
  const s=ds.slice(0,w).join('')+'.'+ds.slice(w).join('');
  const i=ri(0,p+w-1), e=w-1-i, d=ds[i];
  const val=x=>x>=0?String(d*P10(x)):dec(d,-x);
  const es=shuffle([e].concat(pickN(PLACES.map(a=>a[0]).filter(x=>x!==e&&x>=-3&&x<=2),3)));
  const nm=PLACES.find(a=>a[0]===e)[1];
  return {type:'pick',q:'What is the value of the digit '+d+' in this number?',math:s,opts:es.map(val),ans:es.indexOf(e),
    how:['Read the places from the decimal point. To the left: ones, tens, hundreds. To the right: tenths, hundredths, thousandths.','The digit '+d+' is in the '+nm+' place, so it is worth '+val(e)+'.'],v:{t:'digit',d:d}};
});
kind('pv-chain',[3],'Два действия по очереди, слева направо.',[['work out','вычисли']],PVRULE,t=>{
  for(;;){
    const sig=nz(11,999),p=ri(0,2),e1=ri(1,3),e2=ri(1,3),m1=rnd()<.5,m2=!m1;
    const p1=p+(m1?-e1:e1),p2=p1+(m2?-e2:e2);
    if(e1===e2||p1>3||p2>3||sig*P10(Math.max(0,-p1))>99999||sig*P10(Math.max(0,-p2))>99999)continue;
    const a=dec(sig,p),b=dec(sig,p1),c=dec(sig,p2),o1=m1?'×':'÷',o2=m2?'×':'÷';
    return {type:'num',q:'Work out, from left to right.',math:a+' '+o1+' '+P10(e1)+' '+o2+' '+P10(e2),ans:c,
      how:['First step: '+E(a+' '+o1+' '+P10(e1)+' = '+b),'Second step: '+E(b+' '+o2+' '+P10(e2)+' = '+c)],v:{t:'eval'}};
  }
});

/* ---- 2 decimals add / subtract ---- */
const ADDRULE='Выровняй десятичные точки одну под другой и допиши нули: 4.5 = 4.50. Потом складывай или вычитай по разрядам.';
function addItem(a,pa,b,pb,op){
  const p=Math.max(pa,pb),A=a*P10(p-pa),B=b*P10(p-pb),R=op==='+'?A+B:A-B;
  const as=dec(a,pa),bs=dec(b,pb),rs=dec(R,p);
  const how=['Line up the decimal points. Write both numbers with '+p+' decimal place'+(p>1?'s':'')+': '+padp(as,p)+' and '+padp(bs,p)+'.'];
  if(op==='+'){
    const wa=Math.floor(A/P10(p)),wb=Math.floor(B/P10(p)),fa=A%P10(p),fb=B%P10(p);
    how.push('Whole numbers: '+E(wa+' + '+wb+' = '+(wa+wb)));
    how.push('Decimal parts: '+E(dec(fa,p)+' + '+dec(fb,p)+' = '+dec(fa+fb,p)));
    how.push('Put them together: '+E((wa+wb)+' + '+dec(fa+fb,p)+' = '+rs));
  }else{
    const wb=Math.floor(B/P10(p)),fb=B%P10(p);
    if(wb&&fb){how.push('Take away the whole part first: '+E(as+' − '+wb+' = '+dec(A-wb*P10(p),p)));how.push('Then take away the rest: '+E(dec(A-wb*P10(p),p)+' − '+dec(fb,p)+' = '+rs))}
    else how.push('Subtract: '+E(as+' − '+bs+' = '+rs));

/* ---- 3 multiply / divide ---- */
const MULRULE='Умножь как целые числа, потом верни столько же знаков после точки, сколько было в вопросе.';

kind('fr-same',[1],'Сложи или вычти дроби. Ответ сократи.',[['simplest form','несократимый вид'],['numerator (top)','числитель'],['denominator (bottom)','знаменатель']],FRULE,()=>{

kind('fdp-cmp',[1,2,3],'Поставь знак: меньше, равно или больше.',[['less than','меньше чем'],['equal to','равно'],['greater than','больше чем']],FDPRULE,t=>{

kind('fdp-order',[2,3],'Нажимай на числа по порядку: от самого маленького к самому большому.',[['smallest','самое маленькое'],['largest','самое большое'],['order','порядок']],FDPRULE,t=>{

    const out=expr();if(i!==toks.length)throw new Error('trailing tokens in "'+src+'"');return out;

  function relation(s){const parts=s.split(/\s*(=|<|>)\s*/);if(parts.length<3)throw new Error('no relation in {'+s+'}');for(let i=1;i<parts.length;i+=2){const c=cmp(parse(parts[i-1]),parse(parts[i+1]));if(!((parts[i]==='='&&c===0)||(parts[i]==='<'&&c<0)||(parts[i]==='>'&&c>0)))return false}return true}
  const eq=(a,b)=>cmp(a,b)===0;
  function check(it){
    const E_=[],fail=m=>E_.push(m),v=it.v;
    const texts=[it.q,it.story||'',it.math||''].concat(it.how,it.why||[],(it.traps||[]).map(t=>t.m),it.opts||[],[String(it.ans)]);
    if(texts.some(t=>/NaN|undefined|Infinity|null|\[object|\d\.\d{6,}/.test(t)))fail('bad text');
    if(!it.how.length)fail('no method');
    for(const h of it.how){const eqs=h.match(/\{[^}]*\}/g)||[];for(const e of eqs){try{if(!relation(e.slice(1,-1)))fail('false step '+e)}catch(x){fail(x.message)}}}
    if(it.opts){if(new Set(it.opts).size!==it.opts.length)fail('duplicate option');if(it.type!=='order'&&it.type!=='multi'&&!(it.ans>=0&&it.ans<it.opts.length))fail('answer index')}
    for(const t of it.traps||[]){try{if(eq(parse(t.v),parse(String(it.ans))))fail('trap equals answer '+t.v)}catch(x){/* a trap like 3.4 as typed text may not parse */}}
    try{
      if(it.type==='num'||it.type==='frac'){
        const A=parse(it.ans);let want;const pc=v.t==='pct'||v.t==='storypct';const M=pc?div(A,R(100n)):A;
        if(v.t==='eval')want=parse(it.math);
        else if(v.t==='pct')want=mul(parse(it.math),R(100n));
        else if(v.t==='story'||v.t==='storypct'){const shown=it.story+' '+it.q;for(const n of v.nums)if(!shown.includes(n))fail('number '+n+' not shown');want=parse(v.expr);if(v.t==='storypct')want=mul(want,R(100n));
          const used=(shown.match(/\d+(?:\.\d+)?/g)||[]);for(const u of used)if(!v.expr.includes(u))fail('shown number '+u+' unused')}
        else if(v.t==='round'){const x=parse(it.math);const k=v.tp>=0?R(10n**BigInt(v.tp)):R(1n,10n**BigInt(-v.tp));const y=add(mul(x,k),R(1n,2n));want=div(R(y.n/y.d),k);if(!it.q.includes(v.tp===2?'2 decimal':v.tp===1?'1 decimal':v.tp===0?'whole':v.tp===-1?'ten':'hundred'))fail('round label')}
        else if(v.t==='seq'){const t=it.math.split(/,\s+/).slice(0,4).map(parse);const d=sub(t[1],t[0]);if(!eq(sub(t[2],t[1]),d)||!eq(sub(t[3],t[2]),d))fail('not arithmetic');want=add(t[3],d)}
        else if(v.t==='hcf'||v.t==='lcm'){if(!it.q.includes(String(v.a))||!it.q.includes(String(v.b)))fail('numbers not shown');
          if(v.t==='hcf'){let h=0;for(let i=1;i<=Math.min(v.a,v.b);i++)if(v.a%i===0&&v.b%i===0)h=i;want=R(BigInt(h))}else{let x=v.a;while(x%v.b)x+=v.a;want=R(BigInt(x))}}
        else fail('unknown check '+v.t);
        if(want&&!eq(want,A))fail('answer '+it.ans+' != '+want.n+'/'+want.d);
        if(!it.how.some(h=>(h.match(/\{[^}]*\}/g)||[]).some(e=>e.slice(1,-1).split(/\s*[=<>]\s*/).some(s=>{try{return eq(parse(s),M)}catch(x){return false}}))||(v.t==='hcf'||v.t==='lcm')&&h.includes(it.ans)))fail('method does not reach the answer');
        if(it.type==='frac'){const m=/^(?:\d+ )?(\d+)\/(\d+)$/.exec(it.ans);if(m&&(g(BigInt(m[1]),BigInt(m[2]))!==1n||+m[2]===1))fail('answer not simplest');if(!m&&!/^\d+$/.test(it.ans))fail('frac answer format')}
        if(!typedVal(it.ans))fail('answer not typeable');
        if(it.ans.length>10)fail('answer too long');
        if(it.type==='num'&&it.ans.startsWith('−')&&!LV[8].kinds.includes(it.k))fail('negative answer without minus key');
        if(it.type==='frac'&&it.ans.includes('−'))fail('negative fraction');
      }else if(it.type==='pick'){
        let good=[];
        if(v.t==='missing')good=it.opts.map((o,i)=>relation(it.math.replace('□',o))?i:-1);
        else if(v.t==='target'){if(!it.q.includes(it.target))fail('target not shown');good=it.opts.map((o,i)=>eq(parse(o),parse(it.target))?i:-1)}
        else if(v.t==='digit'){const s=it.math,p=s.indexOf(String(v.d)),dot=s.indexOf('.');if(p<0||s.indexOf(String(v.d),p+1)>=0)fail('digit not unique');const e=p<dot?dot-p-1:dot-p;const want=e>=0?R(BigInt(v.d)*10n**BigInt(e)):R(BigInt(v.d),10n**BigInt(-e));good=it.opts.map((o,i)=>eq(parse(o),want)?i:-1);if(!it.q.includes(' '+v.d+' '))fail('digit not asked')}
        else if(v.t==='estimate'){const x=parse(it.math);const err=it.opts.map(o=>{const d=sub(div(parse(o),x),R(1n));return Math.abs(Number(d.n)/Number(d.d))});good=err.map((e,i)=>e<0.2?i:-1);if(err.some((e,i)=>i!==it.ans&&e<0.45))fail('estimate options too close '+it.math+' '+it.opts)}
        else fail('unknown pick check');
        good=good.filter(i=>i>=0);if(good.length!==1||good[0]!==it.ans)fail('exactly-one failed: '+good+' vs '+it.ans+' '+it.math+' '+it.opts);
        if(v.t==='digit'||v.t==='estimate'){const vals=it.opts.map(o=>{const r=parse(o);return r.n+'/'+r.d});if(new Set(vals).size!==vals.length)fail('equal option values')}
      }else if(it.type==='cmp'){
        const l=parse(it.l),r=parse(it.r),c=cmp(l,r),want=c<0?'<':c>0?'>':'=';if(want!==it.ans)fail('cmp');if(it.math!==it.l+' □ '+it.r)fail('cmp display');
        if(['<','=','>'].filter(s=>relation(it.l+' '+s+' '+it.r)).length!==1)fail('cmp uniqueness');
      }else if(it.type==='order'){
        const vals=it.opts.map(parse);const idx=vals.map((_,i)=>i).sort((a,b)=>cmp(vals[a],vals[b]));if(idx.join()!==it.ans.join())fail('order');for(let i=1;i<idx.length;i++)if(eq(vals[idx[i]],vals[idx[i-1]]))fail('equal values in order');
      }else if(it.type==='multi'){
        const divides=(d,n)=>{let s=0;while(s<n)s+=d;return s===n};
        const sq=n=>{for(let i=1;i*i<=n;i++)if(i*i===n)return true;return false};
        const pred={factor:x=>divides(x,v.a),multiple:x=>divides(v.a,x),common:x=>divides(x,v.a)&&divides(x,v.b),commonmult:x=>divides(v.a,x)&&divides(v.b,x),
          prime:x=>{let c=0;for(let i=1;i<=x;i++)if(x%i===0)c++;return c===2},square:sq,cube:x=>{for(let i=1;i*i*i<=x;i++)if(i*i*i===x)return true;return false}}[v.pred];
        const want=it.opts.map((o,i)=>pred(+o)?i:-1).filter(i=>i>=0);
        if(want.join()!==it.ans.join())fail('multi set '+it.q+' '+it.opts);if(!want.length||want.length===it.opts.length)fail('multi trivial');if(it.opts.length!==8)fail('multi size '+it.opts.length);
        if(v.pred!=='prime'&&v.pred!=='square'&&v.pred!=='cube'){if(!it.q.includes(String(v.a)))fail('multi number not shown')}
        if(it.why.length!==it.opts.length)fail('why');
      }else if(it.type==='shift'){
        const o=parse(v.orig),k=it.ans>=0?R(10n**BigInt(it.ans)):R(1n,10n**BigInt(-it.ans));
        if(!eq(parse(it.math),mul(o,k)))fail('shift');if(!eq(parse(it.answerText),parse(it.math)))fail('shift answer text');if(!eq(R(BigInt(it.sig),10n**BigInt(it.p)),o))fail('shift digits');
        const s=String(it.sig),hi=s.length-1-it.p,lo=-it.p;if(hi>3||lo<-3||hi+it.ans>3||lo+it.ans<-3)fail('off the chart '+it.math);
      }
    }catch(x){fail('exception '+x.message)}
    return E_;
  }
  return {parse,check,relation};
})();

function runSelftest(){
  const errs=[],seen={};let items=0,wrongPaths=0,played=0;
  const bad=m=>{if(errs.length<40)errs.push(m)};
  try{
    /* verifier sanity: it must reject wrong things */
    if(V.relation('2 + 3 × 4 = 20')||!V.relation('2 + 3 × 4 = 14')||!V.relation('10% of 80 = 8')||!V.relation('1 1/2 + 1/4 = 7/4')||!V.relation('−3 − 8 = −11'))bad('verifier sanity');
    const broken=make('as-1dp',1);broken.ans='999';if(!V.check(broken).length)bad('verifier accepted a wrong answer');
    for(const id in K){for(const t of K[id].tiers){for(let i=0;i<70;i++){const it=make(id,t);items++;seen[id+t]=seen[id+t]||new Set();seen[id+t].add(sig(it));const e=V.check(it);if(e.length)bad(id+' t'+t+': '+e[0]+' ['+(it.math||it.story||it.q)+']')}
      if(seen[id+t].size<(id==='fa-cubes'?10:5))bad(id+' t'+t+' too little variation: '+seen[id+t].size)}}
    for(let n=1;n<=LV.length;n++){for(let t=1;t<=3;t++)if(!kindsFor(n,t).length)bad('level '+n+' has no kinds at tier '+t)}
    /* UI helpers */
    const click=s=>{const b=document.querySelector(s);if(!b||b.disabled)throw new Error('cannot click '+s+' for '+S.it.k);b.click()};
    const typeAns=s=>{while(S.buf)click('[data-k="⌫"]');const neg=s.startsWith('−');for(const c of neg?s.slice(1):s)click('[data-k="'+(c===' '?'␣':c)+'"]');if(neg)click('[data-k="−"]');if(S.buf!==s)throw new Error('typed '+S.buf+' instead of '+s);click('[data-k="OK"]')};
    const act=(right)=>{const it=S.it;
      if(it.type==='num'){let w=it.ans;if(!right){w=String(Math.floor(Math.abs(typedVal(it.ans).n/typedVal(it.ans).d))+7);if(it.traps&&it.traps.length){const t=it.traps.find(t=>/^−?\d+(\.\d+)?$/.test(t.v)&&t.v.length<=10&&!(t.v.startsWith('−')&&!LV[8].kinds.includes(it.k)));if(t)w=t.v}}typeAns(w)}
      else if(it.type==='frac')typeAns(right?it.ans:'97/89');
      else if(it.type==='pick')click('[data-o="'+(right?it.ans:(it.ans+1)%it.opts.length)+'"]');
      else if(it.type==='cmp')document.querySelector('[data-c="'+(right?it.ans:['<','=','>'].find(s=>s!==it.ans))+'"]').click();
      else if(it.type==='multi'){const set=right?it.ans:[it.opts.map((_,i)=>i).find(i=>!it.ans.includes(i))];set.forEach(i=>click('[data-o="'+i+'"]'));click('#check')}
      else if(it.type==='order'){const seq=right?it.ans:it.ans.slice().reverse();seq.forEach(i=>click('[data-o="'+i+'"]'));click('#check')}
      else if(it.type==='shift'){const d=right?it.ans:-it.ans;for(let i=0;i<Math.abs(d);i++)click(d>0?'#left':'#right');
        if(right&&!same(chartValue(),typedVal(it.answerText)))throw new Error('chart shows wrong value for '+it.math);
        if(!right&&S.shift===it.ans)throw new Error('wrong shift reached answer');click('#check')}
    };
    loadG();
    /* every kind at every tier: wrong -> method shown, no step -> twin of same kind -> correct -> step */
    for(let n=1;n<=10;n++)for(const k of LV[n-1].kinds)for(const t of K[k].tiers){
      for(let rep=0;rep<3;rep++){
        G.runs={};start(n,{fresh:true,tier:t,kind:k});
        act(false);wrongPaths++;
        const fb=$('#fb');if(!fb||!fb.classList.contains('bad'))throw new Error('no bad feedback '+k+' '+(S.it.math||S.it.q)+' ans '+S.it.ans);
        if(S.h!==0||!S.twin||S.twin.k!==k)bad('wrong path state '+k);
        if(fb.querySelectorAll('ol li').length!==S.it.how.length||!fb.textContent.includes('Correct answer'))bad('method missing '+k);
        if(S.it.type==='multi'&&!fb.querySelector('.trap'))bad('multi reasons missing '+k);
        if(!jget(GKEY).answered)bad('not saved');
        const before=fb.innerHTML;submit(S.it.ans);if($('#fb').innerHTML!==before||S.h!==0)bad('double submit '+k);
        click('#next');if(!S.isTwin||S.it.k!==k)bad('twin missing '+k);
        act(true);if(S.h!==1||!$('#fb')||$('#fb').classList.contains('bad'))throw new Error('twin correct failed '+k+' '+(S.it.math||S.it.q)+' ans '+S.it.ans);
        if(S.twin)bad('twin not cleared');played+=2;
      }
    }
    /* a second wrong twin steps the difficulty down */
    G.runs={};start(2,{fresh:true,tier:0});G.tiers[2]=3;next();const t0=S.it.tier,k0=S.it.k;act(false);click('#next');act(false);if(!S.twin||S.twin.k!==k0||S.twin.tier>t0)bad('twin step down');
    /* simplest-form nudge */
    G.runs={};start(4,{fresh:true,tier:1,kind:'fr-simplify'});typeAns(S.it.math);if(S.done||!$('#nudge'))bad('simplify nudge');typeAns(S.it.ans);if(S.h!==1)bad('after nudge');
    G.runs={};start(4,{fresh:true,tier:1,kind:'fr-simplify'});typeAns(S.it.math);typeAns(S.it.math);if(!S.done||S.h!==0)bad('second unsimplified must count as mistake');
    /* every level, played naturally from the first step to the mango */
    for(let n=1;n<=LV.length;n++){
      G.runs={};G.tiers={};G.up={};G.stars={};const xp0=jget(QKEY).xp||0;
      start(n,{fresh:true});let guard=0,top=1;
      while(!S.finished&&guard++<60){top=Math.max(top,S.it.tier);act(true);played++;if(!$('#fb')||$('#fb').classList.contains('bad'))throw new Error('correct rejected L'+n+' '+S.it.k+' '+(S.it.math||S.it.q)+' ans '+S.it.ans);const e=V.check(S.it);if(e.length)bad('live '+e[0]);click('#next')}
      if(!S.finished||S.finished.stars!==3||G.stars[n]!==3||!$('#done'))bad('level '+n+' not finished');
      if(top<3)bad('level '+n+' never got hard');
      if(!((jget(QKEY).xp||0)>xp0))bad('no xp L'+n);
      /* with mistakes */
      start(n,{fresh:true});guard=0;let w=0;
      while(!S.finished&&guard++<60){const wrong=w<4&&!S.isTwin;if(wrong)w++;act(!wrong);click('#next')}
      if(!S.finished||S.finished.stars!==1||G.stars[n]!==3)bad('stars with mistakes L'+n);
    }
    /* resume */
    G.runs={};start(1,{fresh:true});act(true);showMap();if(!G.runs[1]||G.runs[1].h!==1||!document.querySelector('.res'))bad('resume save');start(1);if(S.h!==1)bad('resume load');
    /* storage rules */
    for(const k in MEM)delete MEM[k];
    MEM[QKEY]=JSON.stringify({xp:5,best:{boss:80},mist:{a:1}});MEM[PKEY]=JSON.stringify({day:yesterday(),streak:3});loadG();
    start(1,{fresh:true,tier:1,kind:'pv-type'});act(true);
    const q=JSON.parse(MEM[QKEY]),g=JSON.parse(MEM[GKEY]),p=JSON.parse(MEM[PKEY]);
    if(q.xp!==5+S.xp||q.best.boss!==80||!q.mist||Object.keys(q).length!==3)bad('quiz record merge');
    if('xp' in g)bad('xp in game record');if(p.streak!==4||p.day!==dayStr(new Date()))bad('streak');
    click('#next');act(true);if(JSON.parse(MEM[PKEY]).streak!==4)bad('streak twice a day');
    delete MEM[QKEY];click('#next');act(true);if(!(JSON.parse(MEM[QKEY]).xp>0))bad('create quiz record');
    MEM[QKEY]='not json';click('#next');act(true);if(MEM[QKEY]!=='not json')bad('corrupt record overwritten');
  }catch(e){bad('exception: '+e.message+' '+String(e.stack).split('\n')[1])}
  if(items<2000)bad('too few items '+items);
  const head=errs.length?'GAME_SELFTEST_FAIL '+errs.join(' ; '):'GAME_SELFTEST_OK levels='+LV.length+' kinds='+Object.keys(K).length+' verified='+items+' wrongPaths='+wrongPaths+' played='+played;
  document.body.innerHTML='<pre id="selftest" style="color:#fff;white-space:pre-wrap">'+esc(head)+'</pre>';
}

/* ---------- boot ---------- */
loadG();
if(SELFTEST)runSelftest();
else{
  const n=+QS.get('level');
  if(n>=1&&n<=LV.length){
    start(n,{fresh:true,tier:+QS.get('tier')||0,kind:K[QS.get('kind')]?QS.get('kind'):null});
    const show=QS.get('show');
    if(show==='wrong'){const it=S.it;submit(it.type==='num'?(it.traps&&it.traps[0]?it.traps[0].v:'1'):it.type==='frac'?'97/89':it.type==='pick'?(it.ans+1)%it.opts.length:it.type==='cmp'?['<','=','>'].find(s=>s!==it.ans):it.type==='multi'?[0,1,2]:it.type==='order'?it.ans.slice().reverse():-it.ans)}
    if(show==='right')submit(S.it.type==='multi'||S.it.type==='order'?S.it.ans.slice():S.it.ans);
    if(show==='done'){S.h=S.goal;finish()}
  }else showMap();
}
</script>
