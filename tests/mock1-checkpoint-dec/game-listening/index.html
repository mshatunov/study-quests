<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening Station - ESL listening practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0f3d2a;--card:#fffbea;--ink:#23311f;--soft:#5d6b52;--line:#c9d8a8;
  --brand:#e8710a;--brand2:#f59e0b;--tint:#ecf6cf;
  --good:#2e9e4a;--goodbg:#dff4d2;--bad:#d6452d;--badbg:#fde1d8;--warn:#e8a200;--warnbg:#fdf0c4;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);background-image:radial-gradient(circle at 12% 18%,rgba(163,230,53,.18) 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,rgba(34,197,94,.2) 0 90px,transparent 91px),radial-gradient(circle at 40% 92%,rgba(250,204,21,.12) 0 70px,transparent 71px);background-attachment:fixed;color:var(--ink);font-size:18px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{cursor:pointer;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding:14px 14px 110px;position:relative}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:16px;white-space:nowrap}
.btn{background:var(--brand);color:#fff;border:0;border-radius:20px;padding:10px 18px;min-height:52px;font-weight:700;box-shadow:0 5px 0 #9a4a05;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:var(--card);color:#9a4a05;border:3px solid var(--brand);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
h1{color:#fffbea;font-size:34px;margin:8px 0 4px;line-height:1.15}
.sub{color:#cfe8c4;margin:0 0 14px}
h2{color:#fffbea;font-size:22px;margin:22px 0 4px}
.card{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.25);margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:21px}
.soft{color:var(--soft);font-size:16px}
details.ru{margin-top:8px}
details.ru summary{cursor:pointer;font-weight:700;color:#9a4a05;min-height:40px;display:flex;align-items:center;gap:6px;list-style:none}
details.ru summary::-webkit-details-marker{display:none}
details.ru summary::after{content:"▾"}
details.ru[open] summary::after{content:"▴"}
details.ru p{margin:4px 0 8px;font-size:16px}
.glt{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;font-size:16px}
.glt b{color:#3c6e22}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.tile{background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:12px;min-height:132px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.tile .ico{font-size:34px;line-height:1.1}
.tile .nm{font-weight:700;font-size:17px;line-height:1.2}
.tile .st{margin-top:auto;font-size:22px;color:var(--brand2);letter-spacing:2px}
.tile .st i{font-style:normal;color:#d5dcc0}
.tile.next{border-color:#a3e635}
.ace{font-size:14px;font-weight:700;color:#3c6e22}
.mock{background:linear-gradient(120deg,#a3e635,#4ade80);color:#10331f}
.mock .row{margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* player */
#cplayer.stick{position:sticky;top:6px;z-index:20}
.player{padding:12px;border:4px solid #a3e635}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.play{flex:1 1 170px;font-size:20px;min-height:56px}
.speed{display:flex;border:3px solid var(--line);border-radius:18px;overflow:hidden;flex:0 0 auto}
.speed button{border:0;background:var(--card);min-height:50px;padding:0 14px;font-weight:700;color:var(--soft)}
.speed button.on{background:#16603a;color:#fff}
.speed button:disabled{cursor:not-allowed;opacity:.55}
.heads{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.head{display:flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-weight:600;font-size:15px;transition:transform .15s}
.head span{font-size:20px}
.head.on{background:#16603a;color:#fff;border-color:#a3e635;transform:scale(1.07)}
.tickets{margin-left:auto;font-weight:700;font-size:15px;color:var(--soft);white-space:nowrap}
.pbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.pmsg{font-size:16px;font-weight:600;margin-top:8px}
.pmsg.err{color:#a02a18}
.warnbox{background:var(--warnbg);border:3px solid var(--warn);border-radius:20px;padding:12px 14px;margin-bottom:16px;font-size:17px}
.script{background:var(--card);border-radius:24px;padding:14px 16px;margin-bottom:16px;border:4px dashed var(--line)}
.script p{margin:8px 0;font-size:18px}
.script .who{font-weight:700;color:#3c6e22;margin-right:4px}
mark{background:#fde68a;border-radius:6px;padding:0 2px;color:inherit}
mark sup{font-weight:700;font-size:11px;color:#9a4a05}
/* questions */
.q{scroll-margin-top:170px}
.q .qn{font-size:14px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.q .qt{font-size:21px;font-weight:600;margin:2px 0 10px}
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:11px 14px;min-height:52px;text-align:left;font-weight:600}
.opt.sel{border-color:var(--brand);background:#ffedd5;box-shadow:inset 0 0 0 2px var(--brand)}
.opt.ok{border-color:var(--good);background:var(--goodbg);box-shadow:none}
.opt.no{border-color:var(--bad);background:var(--badbg);box-shadow:none}
.opt:disabled{cursor:default}
.gapline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:20px;font-weight:600}
.gap{border:3px solid var(--line);border-radius:14px;padding:8px 12px;min-height:52px;width:210px;max-width:100%;background:#fff;color:var(--ink);font-size:20px}
.gap:focus{outline:3px solid var(--brand2)}
.gap.ok{border-color:var(--good);background:var(--goodbg)}
.gap.no{border-color:var(--bad);background:var(--badbg)}
.pred{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pred small{font-size:14px;color:var(--soft);font-weight:600;width:100%}
.pred button{border:2px dashed #9db377;background:var(--tint);border-radius:999px;min-height:42px;padding:4px 14px;font-weight:600;font-size:15px}
.pred button.on{border-style:solid;background:#16603a;border-color:#16603a;color:#fff}
.pred button:disabled{cursor:default;opacity:.55}
.pred button.on:disabled{opacity:1}
.stmts{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.stmts li{display:flex;gap:10px;align-items:flex-start;background:var(--tint);border-radius:14px;padding:8px 10px;font-weight:600}
.let{flex:none;width:30px;height:30px;border-radius:50%;background:#16603a;color:#fff;display:grid;place-items:center;font-weight:700}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.lb{width:48px;height:52px;border:3px solid var(--line);background:#fff;border-radius:14px;font-weight:700;font-size:20px}
.lb.used{opacity:.45}
.lb.sel{opacity:1;background:var(--brand);color:#fff;border-color:var(--brand)}
.lb.ok{opacity:1;background:var(--good);color:#fff;border-color:var(--good)}
.lb.no{opacity:1;background:var(--bad);color:#fff;border-color:var(--bad)}
.lb:disabled{cursor:default}
.chosen{min-height:24px;margin-top:8px;font-size:16px;color:var(--soft);font-weight:600}
.fb{margin-top:12px;border-radius:18px;padding:12px 14px;border:3px solid}
.fb.good{background:var(--goodbg);border-color:var(--good)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb b.h{display:block;font-size:19px}
.fb p{margin:6px 0 0;font-size:17px}
.fb .method{background:#fff;border-radius:12px;padding:8px 10px}
.fb .heard{font-style:italic}
.fb .btn{margin-top:8px;min-height:46px;font-size:16px}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(10,40,27,.96);padding:10px 14px max(10px,env(safe-area-inset-bottom));z-index:30}
.foot .in{max-width:752px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.foot span{color:#e6f5de;font-weight:600;font-size:16px}
.score{text-align:center}
.score .stars{font-size:48px;letter-spacing:8px;color:var(--brand2);line-height:1.2}
.score .stars i{font-style:normal;color:#d5dcc0}
.score .big{font-size:32px;font-weight:700;color:#9a4a05}
.score .row{justify-content:center;margin-top:12px}
.replist{display:grid;gap:10px}
.rep{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
@media (max-width:440px){
  body{font-size:17px}
  h1{font-size:29px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:13px;border-radius:24px}
  .player{padding:10px}
  .btn.play{flex-basis:130px;font-size:18px}
  .speed button{padding:0 10px;font-size:15px}
  .q .qt{font-size:19px}
  .lb{width:44px}
}
@media (max-height:560px){#cplayer.stick{position:static}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<canvas id="fx"></canvas>
<script>
'use strict';
/* =====================================================================
   LISTENING STATION - ESL listening practice with the browser voice.
   Storage: 'sq:mock1-checkpoint-dec' (only the numeric "xp" is changed),
            'sq:profile' (daily streak), 'sq:game:listening-station' (progress).
   QA: ?clip=m1  ?clip=m1&state=check  ?mock=1  ?novoice=1  ?selftest
   ===================================================================== */
const QS=new URLSearchParams(location.search);
const SELFTEST=QS.has('selftest');
const MEM=SELFTEST||QS.has('state');
const QKEY='sq:mock1-checkpoint-dec',PKEY='sq:profile',UKEY='sq:ui',GKEY='sq:game:listening-station';

/* ---------- storage ---------- */
function memStore(){const m=new Map();return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>{m.set(k,String(v))},removeItem:k=>{m.delete(k)},key:i=>Array.from(m.keys())[i]||null,get length(){return m.size},clear:()=>m.clear()}}
let LS=null;
if(MEM)LS=memStore();else{try{LS=window.localStorage;LS.getItem(GKEY)}catch(e){LS=memStore()}}
function jget(k,d){try{const v=LS.getItem(k);if(v==null)return d;const o=JSON.parse(v);return (o&&typeof o==='object'&&!Array.isArray(o))?o:d}catch(e){return d}}
function jset(k,o){try{LS.setItem(k,JSON.stringify(o))}catch(e){}}
function dayStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)}
function touchDay(){const p=jget(PKEY,{}),today=dayStr(new Date());if(p.day===today)return;p.streak=p.day===yesterday()?(p.streak||0)+1:1;p.day=today;jset(PKEY,p)}
function dayStreak(){const p=jget(PKEY,{});return (p.day===dayStr(new Date())||p.day===yesterday())?(p.streak||0):0}
function totalXp(){let n=0;try{for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.indexOf('sq:')===0&&k!==PKEY&&k!==UKEY){try{const d=JSON.parse(LS.getItem(k)||'{}');n+=(d&&+d.xp)||0}catch(e){}}}}catch(e){}return n}
function addXp(x){
  try{const raw=LS.getItem(QKEY);let o={};if(raw!=null){o=JSON.parse(raw);if(!o||typeof o!=='object'||Array.isArray(o))return false}
    o.xp=(+o.xp||0)+x;LS.setItem(QKEY,JSON.stringify(o));return true}catch(e){return false}
}
let G=null;
function loadG(){G=jget(GKEY,{});['stars','ace','done','pdone','draft'].forEach(k=>{if(!G[k]||typeof G[k]!=='object')G[k]={}});G.run=+G.run||0;G.bestRun=+G.bestRun||0;G.slow=!!G.slow}
function saveG(){jset(GKEY,G)}

/* ---------- random ---------- */
let seed=(Date.now()^0x2f6e2b1)>>>0;
function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
const range=n=>Array.from({length:n},(_,i)=>i);

/* =====================================================================
   CONTENT (all original). In "mc" the first option is the correct one;
   options are shuffled on screen.
   ===================================================================== */
const STATIONS=[
 {id:1,ico:'📞',name:'Quick Messages',desc:'One speaker. Choose the right answer.'},
 {id:2,ico:'📝',name:'Note Pad',desc:'Complete the notes with a word, a name or a number.'},
 {id:3,ico:'💬',name:'Two Voices',desc:'A conversation. Follow what each person says.'},
 {id:4,ico:'🧩',name:'Who Said It?',desc:'Match each speaker to a sentence. One sentence is extra.'}
];
const M=(q,o,ev,trap,e)=>({t:'mc',q,o,ev,trap,e});
const Gp=(pre,post,type,a,ev,trap,e,x)=>Object.assign({t:'gap',pre,post,type,a,ev,trap,e},x||{});
const H=(sp,a,ev,e)=>({t:'match',sp,a,ev,trap:'match',e});
const CLIPS=[
{id:'m1',st:1,ico:'🏊',title:'Swim Club Message',intro:'Coach Dana leaves a phone message for Oscar.',
 who:[{n:'Coach Dana',g:'f',i:'👩'}],
 lines:[[0,"Hi Oscar, it's Coach Dana from the swimming club."],[0,"I'm ringing about Saturday."],[0,"We usually meet at nine o'clock, but the big pool is being cleaned, so this week we'll start at half past ten instead."],[0,"Don't worry about bringing a towel - the centre is lending them out for free."],[0,"Please do bring your goggles, because we haven't got any spare ones."],[0,"Last week you said your shoulder was sore."],[0,"If it still hurts, just come and watch."],[0,"See you there!"]],
 q:[
  M('What time will they start this Saturday?',['10.30','9.00','9.30'],'this week we\'ll start at half past ten instead','change','Nine o\'clock is the usual time. "This week ... instead" gives the new time: half past ten.'),
  M('Why has the time changed?',['The big pool is being cleaned.','The coach has hurt her shoulder.','The centre opens later on Saturdays.'],'the big pool is being cleaned','mention','The reason comes just before "so". The sore shoulder is Oscar\'s, and it does not change the time.'),
  M('What does the coach ask Oscar to bring?',['🥽 his goggles','🧖 a towel','🧢 a swimming cap'],'Please do bring your goggles','mention','A towel is mentioned first, but he does NOT need it. "Please do bring" points to the goggles.'),
  M('What should Oscar do if his shoulder still hurts?',['Come along and watch','Stay at home and rest','Swim more slowly'],'If it still hurts, just come and watch','detail','Listen to the part after "If it still hurts".')
 ],
 gl:[['ringing','звоню по телефону'],['usually','обычно'],['lending out','выдают на время'],['spare','запасной'],['sore','болит'],['hurts','болит']]},
{id:'m2',st:1,ico:'📚',title:'Library News',intro:'A librarian makes an announcement about a club.',
 who:[{n:'Librarian',g:'m',i:'👨'}],
 lines:[[0,"Good afternoon, everyone."],[0,"This is a message from the library."],[0,"The Story Writing Club is moving."],[0,"It used to meet in the reading corner on Mondays, but from next week it will meet in the computer room on Wednesdays."],[0,"The club is for children aged nine to eleven."],[0,"You don't need to bring paper, as we've got plenty, but please bring a story you've already started."],[0,"At the end of term, the best stories will be read aloud on the local radio."],[0,"If you'd like to join, put your name on the list by the front door."]],
 q:[
  M('On which day will the club meet from next week?',['Wednesday','Monday','Friday'],'on Wednesdays','change','"It used to meet on Mondays" is the old day. After "from next week" comes the new one.'),
  M('Where will the club meet from next week?',['In the computer room','In the reading corner','Beside the front door'],'it will meet in the computer room','mention','All these places are possible to hear. The front door is only where the list is.'),
  M('What should members bring?',['A story they have begun','Some paper to write on','A book from the library shelf'],'please bring a story you\'ve already started','paraphrase','"Already started" means the same as "begun". Paper is not needed.'),
  M('What will happen to the best stories?',['People will hear them on the radio.','They will be printed in a magazine.','They will be put up beside the door.'],'the best stories will be read aloud on the local radio','paraphrase','"Read aloud on the local radio" means people will hear them.')
 ],
 gl:[['announcement','объявление'],['used to meet','раньше собирался'],['aged','в возрасте'],['plenty','много, достаточно'],['term','четверть (в школе)'],['join','вступить, присоединиться']]},
{id:'m3',st:1,ico:'🎒',title:'Lost on the Bus',intro:'Freya phones the bus company about something she lost.',
 who:[{n:'Freya',g:'f',i:'👧'}],
 lines:[[0,"Hello, my name's Freya."],[0,"I think I left my rucksack on the number fourteen bus this morning."],[0,"I got on near the park and got off at the museum at about quarter past eight."],[0,"The bag is dark green with a yellow zip, and it's not very big."],[0,"Inside there's my lunch box, a library book about sharks and my dad's old camera."],[0,"I'm really worried about the camera, because it belonged to my grandad first."],[0,"Please ring my mum if anyone finds it."],[0,"Thank you."]],
 q:[
  M('Which bus was Freya on?',['Number 14','Number 40','Number 4'],'on the number fourteen bus','number','fourTEEN has the strong sound at the end. FORty has it at the start.'),
  M('What does the bag look like?',['Dark green with a yellow zip','Yellow with a dark green zip','Dark green with a black zip'],'The bag is dark green with a yellow zip','detail','Hold both colours in your head: the bag first, then the zip.'),
  M('Where did Freya get off the bus?',['At the museum','At the park','At the library'],'got off at the museum','mention','She got ON near the park and got OFF at the museum. The question asks about "off".'),
  M('What is Freya most worried about?',['Her dad\'s camera','Her lunch box','Her library book'],'I\'m really worried about the camera','opinion','Three things are in the bag. The feeling words "really worried" show which one matters.')
 ],
 gl:[['rucksack','рюкзак'],['got on','села (в автобус)'],['got off','вышла (из автобуса)'],['zip','молния (застежка)'],['worried','переживаю'],['belonged','принадлежал']]},
{id:'m4',st:1,ico:'🎪',title:'Spring Fair Update',intro:'A radio presenter gives news about a fair.',
 who:[{n:'Radio presenter',g:'m',i:'🎙️'}],
 lines:[[0,"And now some news for families."],[0,"The Spring Fair at Mill Field was planned for Saturday, but heavy rain is expected all day, so it will now take place on Sunday afternoon."],[0,"The gates open at one o'clock."],[0,"Tickets cost four pounds for adults, and children under twelve get in free."],[0,"There will be pony rides, a puppet show and a baking contest."],[0,"Sadly, the bouncy castle has been cancelled this year."],[0,"The organisers advise visitors to wear boots, because the ground will still be muddy."]],
 q:[
  M('When will the fair take place?',['Sunday afternoon','Saturday afternoon','Saturday morning'],'it will now take place on Sunday afternoon','change','Saturday was the old plan. "It will now take place" gives the final day.'),
  M('Who can get in without paying?',['Children younger than twelve','All the adults in a family','Visitors who bring their own boots'],'children under twelve get in free','paraphrase','"Under twelve" means "younger than twelve", and "get in free" means "without paying".'),
  M('Which activity will NOT be at the fair this year?',['A bouncy castle','Pony rides','A puppet show'],'the bouncy castle has been cancelled','detail','Notice NOT in the question. Listen for "cancelled".'),
  M('Why should visitors wear boots?',['The ground will be muddy.','It is going to snow on Sunday.','There will be a long walking race.'],'because the ground will still be muddy','detail','The reason comes straight after "because".')
 ],
 gl:[['fair','ярмарка'],['is expected','ожидается'],['take place','проходить, состояться'],['contest','конкурс'],['pony rides','катание на пони'],['puppet show','кукольный спектакль'],['bouncy castle','надувной замок-батут'],['cancelled','отменен'],['advise','советовать']]},

{id:'n1',st:2,ico:'🌲',title:'Young Explorers Walk',intro:'A guide gives information about a walk.',
 who:[{n:'Guide',g:'f',i:'👩'}],
 lines:[[0,"Welcome to Pine Hill Nature Reserve."],[0,"Here's what you need to know about our Young Explorers walk."],[0,"The next walk is on the sixteenth of May."],[0,"We meet at the wooden bridge, not at the car park as we did last year."],[0,"The walk lasts ninety minutes."],[0,"It costs five pounds for each child."],[0,"Please bring binoculars if you've got them, because we often see herons on the lake."],[0,"Your guide will be Mrs Whitlow. That's W-H-I-T-L-O-W.","Your guide will be Mrs Whitlow. That's spelled: W, H, I, T, L, O, W."]],
 q:[
  Gp('Date of the next walk:','May','number',['16','16th','sixteenth','the sixteenth'],'on the sixteenth of May','number','Six-TEENTH: the strong sound is at the end. SIX-ty would sound different.',{strip:['may','of','the']}),

  let t=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[£$]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim().replace(/[.,;:!?]+$/,'').trim();
  if(g&&g.type==='time'){t=t.replace(/(\d)\s*[.]\s*(\d\d)/g,'$1:$2').replace(/(\d|\b[a-z]+)\s*(a\.?m\.?|p\.?m|o'? ?clock)\.?$/,'$1').replace(/^at /,'').trim()}
  t=t.replace(/^(a|an|the) /,'');
  const strip=(g&&g.strip)||[];
  for(let again=true;again;){again=false;for(const w of strip){if(t.startsWith(w+' ')){t=t.slice(w.length+1);again=true}if(t.endsWith(' '+w)){t=t.slice(0,-w.length-1);again=true}}}
  return t.trim();
}
/* canonical form: number words -> digits, clock phrases -> h:mm, spelled letters joined */
function canon(s,g){
  let t=norm(s,g).replace(/[.,;!?](?=\s|$)/g,'');
  t=t.replace(/(^| )([a-z](?: [a-z](?= |$)){2,})/g,(m,p,l)=>p+l.replace(/ /g,''));
  const w=t.split(' '),out=[];
  for(let i=0;i<w.length;i++){
    const x=w[i];
    if(x in TENS){let v=TENS[x];const n=w[i+1];if(n&&n in ONES&&ONES[n]>0&&ONES[n]<10){v+=ONES[n];i++}out.push(String(v))}
    else if(x in ONES)out.push(String(ONES[x]));
    else out.push(x);
  }
  t=out.join(' ').replace(/\b(\d+)(st|nd|rd|th)\b/g,'$1').replace(/\b(a )?quarter past (\d+)/g,(m,a,h)=>h+':15').replace(/\bhalf past (\d+)/g,'$1:30').replace(/\b(\d+)[.:]00\b/g,'$1');
  if(g&&g.type==='time')t=t.replace(/\b(\d{1,2}) (15|30|45)\b/g,'$1:$2').replace(/(\d)\.(\d\d)/g,'$1:$2');
  return t;
}
function gapOk(input,g){
  if(!String(input||'').trim())return false;
  const n=norm(input,g);if(!n)return false;
  if(g.a.concat(g.alt||[]).some(a=>norm(a,g)===n))return true;
  return canon(input,g)===canon(g.a[0],g);
}
function lev(a,b){const m=a.length,n=b.length,d=range(n+1);for(let i=1;i<=m;i++){let p=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[n]}
function nearMiss(input,g){if(g.type==='number'||g.type==='time')return false;const n=norm(input,g),a=norm(g.a[0],g);return a.length>=4&&n!==a&&lev(n,a)<=1}

let SY=null,UT=null;
if(!SELFTEST&&!QS.has('novoice')&&'speechSynthesis'in window&&'SpeechSynthesisUtterance'in window){SY=window.speechSynthesis;UT=window.SpeechSynthesisUtterance}
const VS={state:SY?'loading':'unsupported',list:[]};   /* loading | ok | none (no English voice) | unknown (empty list) | unsupported */
let FQ=null;                                           /* fake timer queue used by the self-test */
function later(fn,ms){if(FQ){const h={fn,ms,dead:false};FQ.push(h);return h}return setTimeout(fn,ms)}
function unlater(h){if(!h)return;if(typeof h==='object'&&'dead'in h)h.dead=true;else clearTimeout(h)}
const NOVELTY=/^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|pipe organ|fred|junior|ralph|kathy|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i;
const FEMALE=/(female|\bkate\b|serena|martha|stephanie|fiona|moira|karen|samantha|tessa|sonia|libby|maisie|susan|hazel|zira|victoria|catherine|allison|\bava\b|\bamy\b|emma|jenny|aria|isha|veena|nicky)/i;
const MALE=/(\bmale\b|daniel|arthur|oliver|jamie|\bryan\b|george|rishi|\balex\b|\btom\b|aaron|thomas|gordon|\blee\b|\bguy\b|david|\bmark\b|james|evan|nathan)/i;
const langOf=v=>String(v.lang||'').replace('_','-').toLowerCase();
function scoreVoice(v){
  const l=langOf(v),n=v.name+' '+(v.voiceURI||'');let s=0;
  if(l.startsWith('en-gb'))s+=100;else if(/^en-(ie|au|nz)/.test(l))s+=50;else if(l.startsWith('en-us'))s+=30;else s+=5;
  if(/premium|enhanced|natural/i.test(n))s+=15;
  if(/daniel|kate|serena|martha|arthur|oliver|stephanie|jamie|sonia|ryan|libby|google uk/i.test(n))s+=8;
  return s;
}
function englishVoices(list){
  const en=Array.from(list||[]).filter(v=>/^en([-_]|$)/i.test(v.lang||''));
  const good=en.filter(v=>!NOVELTY.test(v.name));
  return (good.length?good:en).sort((a,b)=>scoreVoice(b)-scoreVoice(a));
}
function refreshVoices(final){
  if(!SY){VS.state='unsupported';return}
  let all=[];try{all=SY.getVoices()||[]}catch(e){}
  const old=VS.state;
  if(all.length){VS.list=englishVoices(all);VS.state=VS.list.length?'ok':'none'}
  else if(final)VS.state='unknown';
  if(VS.state!==old)onVoiceState();
}
function initVoices(){
  if(!SY){VS.state='unsupported';return}
  refreshVoices(false);
  const h=()=>refreshVoices(false);
  try{if(SY.addEventListener)SY.addEventListener('voiceschanged',h);else SY.onvoiceschanged=h}catch(e){}
  let n=0;const poll=()=>{n++;refreshVoices(n>=12);if(VS.state==='loading')later(poll,250)};
  if(VS.state==='loading')later(poll,250);
}
/* one voice and pitch for every speaker of a clip */
function cast(who){
  const used=new Set();
  return who.map((w,i)=>{
    const L=VS.list;let v=null;
    const gender=x=>FEMALE.test(x.name)?'f':MALE.test(x.name)?'m':'?';
    v=L.find(x=>!used.has(x)&&gender(x)===w.g)||L.find(x=>!used.has(x)&&gender(x)==='?')||null;
    let pitch;
    if(v){used.add(v);pitch=who.length>1?(w.g==='f'?1.08:0.95):1}
    else{
      const same=L.filter(x=>gender(x)===w.g);v=same.length?same[i%same.length]:(L.length?L[i%L.length]:null);
      pitch=(w.g==='f'?[1.15,1.35,1.0,1.25,1.1]:[0.8,0.95,0.7,0.88,0.75])[i%5];
    }
    return {voice:v,pitch};
  });
}
const PL={on:false,id:0,timers:[],keep:null,who:-1,done:0,total:1,fails:0};
function clearTimers(){PL.timers.forEach(unlater);PL.timers=[]}
function stopSpeech(){
  PL.id++;PL.on=false;PL.who=-1;clearTimers();
  if(SY){try{SY.cancel()}catch(e){}}
}
function chunks(lines){
  const out=[];lines.forEach(l=>{const t=l[2]||l[1];(t.match(/[^.!?]+(?:[.!?]+|$)/g)||[t]).forEach(p=>{if(p.trim())out.push([l[0],p.trim()])})});return out;
}
/* speaks the chunks one by one; calls onDone() or onFail() exactly once unless stopped */
function speakSeq(clip,list,onDone,onFail,onHeard){
  if(!SY)return onFail();
  try{if(SY.speaking||SY.pending)SY.cancel();if(SY.paused)SY.resume()}catch(e){}
  clearTimers();
  const id=++PL.id,cs=cast(clip.who);PL.on=true;PL.done=0;PL.total=list.length;
  let k=0,heard=false;
  const fail=()=>{if(id!==PL.id)return;stopSpeech();onFail()};
  const next=()=>{
    if(id!==PL.id)return;
    if(k>=list.length){PL.on=false;PL.who=-1;clearTimers();return onDone()}
    const [sp,text]=list[k++],c=cs[sp];let over=false,started=false,wd=null;
    const finish=()=>{if(over||id!==PL.id)return;over=true;unlater(wd);PL.done=k;progress();
      const gap=k<list.length&&list[k][0]!==sp?650:180;PL.timers.push(later(next,gap))};
    try{
      const u=new UT(text);if(c.voice){u.voice=c.voice;u.lang=c.voice.lang}else u.lang='en-GB';
      const rate=curRate();u.rate=rate;u.pitch=c.pitch;
      u.onstart=()=>{if(id!==PL.id||over)return;started=true;if(!heard&&onHeard)onHeard();heard=true;unlater(wd);PL.who=sp;progress();
        wd=later(finish,text.length/(9*rate)*1000+8000);PL.timers.push(wd)};
      const t0=Date.now();
      /* some browsers never fire "start": an "end" after real speaking time still counts, an instant one is a failure */
      u.onend=()=>{if(id!==PL.id||over)return;if(!started&&!heard){if(Date.now()-t0<500)return fail();heard=true;if(onHeard)onHeard()}finish()};
      u.onerror=ev=>{if(id!==PL.id||over)return;const er=ev&&ev.error;if(er==='canceled'||er==='interrupted'){if(!heard)fail();else{stopSpeech();onFail()}return}fail()};
      PL.keep=u;
      wd=later(()=>{if(id!==PL.id||over||started)return;if(heard&&SY.speaking){wd=later(finish,text.length/(9*rate)*1000+8000);PL.timers.push(wd)}else fail()},6000);PL.timers.push(wd);
      SY.speak(u);
    }catch(e){fail()}
  };
  next();
}

function newDraft(c){
  return {ans:c.q.map(()=>null),pred:c.q.map(()=>null),plays:0,played:false,read:false,
    order:c.q.map(q=>q.t==='mc'?shuffle(range(q.o.length)):null),so:c.s?shuffle(range(c.s.length)):null};
}
function validDraft(d,c){return d&&Array.isArray(d.ans)&&d.ans.length===c.q.length&&Array.isArray(d.order)&&c.q.every((q,i)=>q.t!=='mc'||(d.order[i]&&d.order[i].length===q.o.length))&&(!c.s||(d.so&&d.so.length===c.s.length))}

  stopSpeech();const c=BYID[id];

}

            else if(p.t==='mc')click(`.opt[data-q="${j}"][data-o="0"]`);else if(p.t==='gap')type(j,p.a[0]);
          });
          if(q.t==='match')c.q.forEach((p,j)=>{if(j!==i&&p.a!==w)click(`.lb[data-q="${j}"][data-s="${p.a}"]`)});
          T(click('[data-act="check"]'),c.id+' q'+i+' check wrong');
          T(V.res&&V.res.ok[i]===false,c.id+' q'+i+' wrong accepted: '+w);
          const card=app.querySelector('#q'+i);T(card&&card.querySelector('.fb.bad .method')&&card.querySelector('.fb.bad').textContent.includes(q.ev),c.id+' q'+i+' teaching feedback');
          T(G.run<=c.q.length-1-i,c.id+' run resets');
          const n=fake.spoken.length;if(click(`#q${i} [data-act="hear"]`)){flush();T(fake.spoken.length>n,c.id+' hear part')}else T(false,c.id+' hear button');
          wrongPaths++;
        });
      });
      click('[data-act="again"]');T(V.d.plays===0&&!V.res,c.id+' try again resets');
    }
    note.push('wrongPaths='+wrongPaths);

    /* accepted spellings and rejected near misses */
    const gp=(id,i)=>BYID[id].q[i];
    const yes=[['n1',0,['16','16th','Sixteenth','the sixteenth']],['n1',2,['90','ninety','90 minutes','Ninety mins']],['n1',3,['5','£5','five','five pounds','£5.00','5.00']],['n1',5,['whitlow','Mrs Whitlow','WHITLOW.']],['n1',1,['Bridge','wooden bridge','the bridge']],
      ['n2',1,['2.15','2:15','quarter past two','a quarter past 2','two fifteen','2.15pm','2:15 p.m.','14:15','Quarter past two.']],['n2',2,['first','1st','1','the first floor']],['n3',2,['7','seven','7.00','7:00 pm','seven o\'clock','19:00']],['n3',4,['32','thirty-two','Thirty two','£32','32 pounds']],['n3',3,['torch','a torch','flashlight']],['n4',1,['12.30','12:30','half past twelve','half past 12','twelve thirty']],['n4',3,['lights','light']],['n3',0,['friday','Friday']],['n3',5,['Garden','garden street']]];
    yes.forEach(([id,i,l])=>l.forEach(v=>T(gapOk(v,gp(id,i)),`accept ${id}.${i} "${v}"`)));
    const no=[['n1',0,['60','6','15','sixty','16 June']],['n1',2,['19','nineteen','9']],['n1',3,['4','fifteen','50']],['n1',4,['binocular s','glasses','telescope']],['n1',5,['Whitlaw','Witlow','Whitelow']],['n2',1,['2.50','4','2:45','2.30','half past two','quarter to two']],['n3',4,['13','23','thirty','302']],['n4',1,['12','10','2.30','half past two']],['n4',4,['40','15','fifteen']],['n3',2,['17','11','7.30']]];
    no.forEach(([id,i,l])=>l.forEach(v=>T(!gapOk(v,gp(id,i)),`reject ${id}.${i} "${v}"`)));
    T(nearMiss('Witlow',gp('n1',5))&&!nearMiss('zzz',gp('n1',5)),'near miss');

    /* mock paper through the UI: all right, then all wrong */
    LS.clear();loadG();showHome();
    for(const good of [true,false]){
      click('[data-act="mocknew"]');
      for(let p=0;p<4;p++){
        const c=V.c;T(V.mock&&app.querySelector('[data-act="speed"]').disabled,'mock normal speed only');listen();
        if(good)fillRight(c);else c.q.forEach((q,i)=>{if(q.t==='mc')click(`.opt[data-q="${i}"][data-o="1"]`);else if(q.t==='gap')type(i,'zzz');else click(`.lb[data-q="${i}"][data-s="${c.q[(i+1)%c.q.length].a}"]`)});
        if(p===1){showHome();T(/Continue/.test(app.textContent),'mock resume');click('[data-act="mockgo"]')}
        T(click('[data-act="check"]'),'mock lock in');
      }
      T(V.screen==='report','mock report');
      const r=G.mock.res.reduce((a,x)=>a+x.right,0),n=G.mock.res.reduce((a,x)=>a+x.n,0);T(good?r===n:r===0,'mock score '+r+'/'+n);
      for(let p=0;p<4;p++){click(`[data-act="review"][data-k="${p}"]`);T(V.review&&app.querySelectorAll('.fb').length===V.c.q.length,'mock review');click('[data-act="report"]')}
    }

    /* storage rules */
    LS.clear();LS.setItem(QKEY,JSON.stringify({xp:7,best:{a:1},mist:{b:2}}));LS.setItem(PKEY,JSON.stringify({day:yesterday(),streak:3,x:1}));loadG();
    openClip('m1',false);listen();click('.opt[data-q="0"][data-o="0"]');T(jget(GKEY,{}).draft.m1.ans[0]===0,'saved after each answer');
    [1,2,3].forEach(i=>click(`.opt[data-q="${i}"][data-o="0"]`));click('[data-act="check"]');
    const q=jget(QKEY,{}),p=jget(PKEY,{}),g=jget(GKEY,{});
    T(q.xp===7+40+15&&q.best.a===1&&q.mist.b===2,'quiz record merge '+q.xp);T(p.streak===4&&p.day===dayStr(new Date())&&p.x===1,'daily streak');T(!('xp'in g)&&g.stars.m1===3,'game key has no xp');
    openClip('m1',false);listen();[0,1,2,3].forEach(i=>click(`.opt[data-q="${i}"][data-o="0"]`));const x1=totalXp();click('[data-act="check"]');T(totalXp()-x1>=8&&totalXp()-x1<=13,'replay gives less XP');
    LS.setItem(QKEY,'not json');T(addXp(5)===false&&LS.getItem(QKEY)==='not json','broken record untouched');

    /* content checks, second method */
    const ids=new Set();let mcN=0,tfq=0;
    for(const c of CLIPS){
      T(!ids.has(c.id),'dup id');ids.add(c.id);
      T(KEY2[c.id]&&KEY2[c.id].length===c.q.length,'key length '+c.id);
      c.q.forEach((x,i)=>{
        tfq++;const key=KEY2[c.id][i];
        const lines=c.lines.filter(l=>x.t!=='match'||l[0]===x.sp);
        T(lines.some(l=>l[1].includes(x.ev)),`evidence ${c.id}.${i}`);T(TIPS[x.trap]&&x.e,'tip '+c.id+i);
        if(x.t==='mc'){mcN++;T(new Set(x.o.map(s=>s.toLowerCase())).size===x.o.length&&x.o.length===3,'unique options '+c.id+i);const m=x.o.map((o,j)=>o.includes(key)?j:-1).filter(j=>j>=0);T(m.length===1&&m[0]===0,`key2 ${c.id}.${i} ${key} -> ${m}`)}
        else if(x.t==='gap'){const ev=' '+canon(x.ev,{type:x.type})+' ';T(ev.includes(' '+canon(key,x)+' '),`evidence value ${c.id}.${i}: ${ev} / ${canon(key,x)}`);T(gapOk(key,x),`key2 gap ${c.id}.${i}`);x.a.forEach(a=>{T(gapOk(a,x),'listed answer '+a);T(canon(a,x)===canon(x.a[0],x),`spelling consistent ${c.id}.${i} ${a}: ${canon(a,x)}`)});T(PTYPES.some(t=>t[0]===x.type),'ptype')}
        else{const m=c.s.map((s,j)=>s.includes(key)?j:-1).filter(j=>j>=0);T(m.length===1&&m[0]===x.a,`key2 match ${c.id}.${i} ${key} -> ${m}`)}
      });
      if(c.s){T(c.s.length>c.q.length,'spare sentence '+c.id);T(new Set(c.q.map(x=>x.a)).size===c.q.length,'one each '+c.id)}
      /* glossary must not translate a gap answer */
      c.gl.forEach(([en])=>c.q.forEach(x=>{if(x.t==='gap')T(!x.a.some(a=>a.toLowerCase()===en.toLowerCase()),'gloss leaks '+en)}));
      const words=c.lines.map(l=>l[1]).join(' ').split(/\s+/).length;T(words>=50&&words<=170,'length '+c.id+' '+words);
      c.lines.forEach(l=>T(c.who[l[0]],'speaker '+c.id));
    }
    T(CLIPS.length>=12,'12 clips');
    /* generated rounds: random mock papers with shuffled choices */
    let gen=0;seed=12345;
    for(let n=0;n<220;n++){
      const pickIds=mockPick();T(new Set(pickIds.map(i=>BYID[i].st)).size===4,'one per station');
      for(const id of pickIds){const c=BYID[id],d=newDraft(c);
        c.q.forEach((x,i)=>{gen++;const key=KEY2[id][i];
          if(x.t==='mc'){const shown=d.order[i].map(j=>x.o[j]);T(new Set(shown).size===3&&shown.filter(s=>s.includes(key)).length===1,'gen mc '+id+i);T(shown.findIndex(s=>s.includes(key))===d.order[i].indexOf(0),'gen mc index '+id+i)}
          else if(x.t==='match'){const shown=d.so.map(j=>c.s[j]);T(new Set(shown).size===c.s.length&&shown.filter(s=>s.includes(key)).length===1&&c.s[x.a].includes(key),'gen match '+id+i)}
          else{const ev=' '+canon(x.ev,{type:x.type})+' ';T(ev.includes(' '+canon(key,x)+' ')&&gapOk(key,x)&&!gapOk('zzz',x),'gen gap '+id+i)}
        })}
    }
    T(gen>=2000,'generated '+gen);note.push('generated='+gen,'questions='+tfq);
    const all=JSON.stringify([CLIPS,TIPS,STATIONS])+document.documentElement.innerHTML;
    T(!new RegExp('[\\u0451\\u0401\\u2013\\u2014]').test(all),'forbidden characters');
    showHome();T(app.querySelectorAll('.tile').length===CLIPS.length,'home tiles');T(app.querySelector('a[href="../"]'),'back link');
  }catch(e){errs.push('exception '+e.message+' '+(e.stack||'').split('\n').slice(1,3).join(' '))}
  if(snap()!==before)errs.push('real storage was changed');
  const head=errs.length?'GAME_SELFTEST_FAIL '+errs.join('; '):'GAME_SELFTEST_OK clips='+CLIPS.length+' checks='+checks+' '+note.join(' ');
  document.body.innerHTML='<pre id="selftest" style="color:#fff;white-space:pre-wrap">'+esc(head)+'</pre>';
}

/* ---------- boot ---------- */
if(SELFTEST){loadG();runSelftest()}
else{
  loadG();initVoices();
  const qc=QS.get('clip');
  if(qc&&BYID[qc]){
    openClip(qc,false);
    const st=QS.get('state');
    if(st==='check'){V.d.played=true;V.d.plays=1;V.c.q.forEach((q,i)=>{const wrong=i%2===1;if(q.t==='mc')V.d.ans[i]=wrong?1:0;else if(q.t==='gap'){V.d.ans[i]=wrong?'zebra':q.a[0];V.d.pred[i]=q.type}else V.d.ans[i]=wrong?V.c.q[(i+1)%V.c.q.length].a:q.a});check()}
    else if(st==='read'){V.d.read=true;V.showScript=true;renderClip()}
  }else if(QS.has('mock'))newMock();
  else showHome();
}
</script>
