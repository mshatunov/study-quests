<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Unit 1 - Quest</title>
<style>
:root{
  --bg:#f4f1ff; --card:#fff; --ink:#26224a; --soft:#6b6890; --line:#e3defa;
  --brand:#6c4cf1; --brand2:#8f78ff; --good:#17b26a; --goodbg:#e6f8ef; --bad:#e5484d; --badbg:#fdeceb;
  --warn:#f59e0b; --blue:#4c8bf5; --red:#ef5350;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.4;min-height:100vh}
button{font:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 90px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:800;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
h1{font-size:34px;margin:6px 0 4px}
.sub{color:var(--soft);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tcard{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.tcard:hover{transform:translateY(-3px);border-color:var(--brand2)}
.tcard .ico{font-size:44px}
.tcard h3{margin:0;font-size:22px}
.tcard p{margin:0;color:var(--soft);font-size:16px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-weight:800;box-shadow:0 4px 0 #4a31b8}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none}
.btn.gray{background:#8c89ad;box-shadow:0 4px 0 #6b6890}
.btn:disabled{opacity:.4;cursor:not-allowed}
.boss{margin-top:18px;background:linear-gradient(120deg,#6c4cf1,#d946ef);color:#fff;border-radius:22px;padding:18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.boss h3{margin:0;font-size:24px}
.boss .btn{background:#fff;color:var(--brand);box-shadow:0 4px 0 #cfc4ff}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .bar{flex:1;height:14px}
.xbtn{background:none;border:0;font-size:26px;color:var(--soft)}
.qcard{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px}
.qtag{font-size:14px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.qtext{font-size:23px;font-weight:700;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;color:var(--ink);font-weight:600;transition:.1s}
.opt:hover:not(:disabled){border-color:var(--brand2);background:#faf8ff}
.opt.sel{border-color:var(--brand);background:#f0ecff}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;display:none}
.fb.show{display:block}
.fb.good{background:var(--goodbg);border:2px solid var(--good)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb.part{background:#fff6e0;border:2px solid var(--warn)}
.fb b.h{display:block;font-size:20px;margin-bottom:4px}
.fb .src{color:var(--soft);font-size:14px;margin-top:6px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
/* order */
.pool,.seq{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seq{flex-direction:column}
.tile{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:600;text-align:left;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--brand2)}
.tile.used{opacity:.25;pointer-events:none}
.slot{display:flex;gap:10px;align-items:center;min-height:48px;border:3px dashed var(--line);border-radius:14px;padding:6px 10px;background:#fcfbff}
.slot .n{background:var(--brand);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.slot.ok{border:3px solid var(--good);background:var(--goodbg)}
.slot.no{border:3px solid var(--bad);background:var(--badbg)}
.slot .t{flex:1;cursor:pointer}
/* match */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{border:3px solid var(--line);border-radius:14px;padding:9px 12px;background:#fff;text-align:left;font-weight:600;color:var(--ink);font-size:17px}
.mi.act{outline:3px solid var(--brand);}
.mi.ok{background:var(--goodbg)!important}
.mi.no{background:var(--badbg)!important}
.pc0{border-color:#6c4cf1}.pc1{border-color:#17b26a}.pc2{border-color:#f59e0b}.pc3{border-color:#ef5350}.pc4{border-color:#06b6d4}.pc5{border-color:#d946ef}.pc6{border-color:#64748b}
.mi .tg{float:right;font-size:13px;opacity:.7}
/* sort */
.srt{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:3px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.srow.ok{border-color:var(--good);background:var(--goodbg)}
.srow.no{border-color:var(--bad);background:var(--badbg)}
.srow .cats{display:flex;gap:6px;flex-wrap:wrap}
.cb{background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:15px;color:var(--ink)}
.cb.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.srow .fix{grid-column:1/-1;font-size:14px;color:var(--bad);font-weight:700}
/* fill */
.fillq{font-size:22px;line-height:2.1}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--brand2);background:#f0ecff;border-radius:8px 8px 0 0;padding:0 8px;text-align:center;font-weight:800;color:var(--brand);vertical-align:baseline;cursor:pointer}
.blank.ok{border-color:var(--good);background:var(--goodbg);color:#0a7a47}
.blank.no{border-color:var(--bad);background:var(--badbg);color:#a0282c}
/* heart */
.heartbox{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:16px;align-items:start}
@media(max-width:700px){.heartbox,.mcols{grid-template-columns:1fr}}
.hl{display:flex;flex-direction:column;gap:6px}
.hl label{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;font-size:16px}
.hl .num{background:var(--brand);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:800}
.hl select{font:inherit;font-size:16px;padding:6px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%}
.hl select.ok{border-color:var(--good);background:var(--goodbg)}
.hl select.no{border-color:var(--bad);background:var(--badbg)}
/* results */
.res{text-align:center}
.res .big{font-size:64px}
.stars{font-size:48px;letter-spacing:6px}
.scorebig{font-size:42px;font-weight:800;color:var(--brand)}
.weak{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left;margin:14px 0}
/* cheat */
.sheet{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px 20px}
.sheet h3{margin:14px 0 6px;color:var(--brand)}
.sheet ul{margin:4px 0 4px 20px;padding:0}
.sheet table{border-collapse:collapse;width:100%;font-size:16px;margin:6px 0}
.sheet td,.sheet th{border:2px solid var(--line);padding:6px 10px;text-align:left}
.sheet th{background:#f0ecff}
.ru{color:var(--soft);font-size:.9em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.combo{color:var(--warn)}
.note{background:#fff6e0;border:2px solid var(--warn);border-radius:14px;padding:10px 14px;font-size:16px;margin:12px 0}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ============================================================
   Grade 5 Science - Unit 1 quest (Human body, reproduction, disease)
   All facts come from the class materials: Heart, Blood, Blood vessels,
   Respiratory System, Reproductive System, Puberty, Insect Bites,
   Unit 1.4 Types of pathogen, Body Defence and Hygiene, Revision pack.
   ============================================================ */

/* ---------- question builders ---------- */
const mc   = (q,a,w,e,s)=>({t:'mc',q,a,w,e,s});
const tf   = (q,v,e,s)=>({t:'tf',q,v,e,s});
const multi= (q,a,w,e,s)=>({t:'multi',q,a,w,e,s});
const order= (q,items,e,s)=>({t:'order',q,items,e,s});
const match= (q,pairs,e,s)=>({t:'match',q,pairs,e,s});
const sort = (q,cats,items,e,s)=>({t:'sort',q,cats,items,e,s});
const fill = (q,ans,bank,e,s)=>({t:'fill',q,ans,bank,e,s});
const heartQ=(e,s)=>({t:'heart',q:'Label the heart! Choose the correct name for each number.',e,s});

/* ---------- topics ---------- */
const TOPICS = [
{id:'heart', ico:'❤️', name:'Heart, Blood & Blood Vessels', blurb:'Heart chambers, arteries, veins, capillaries, blood cells', col:'#ef5350', Q:[
 mc('What is the heart?','A muscular organ that pumps blood around your body',['A tube that carries air to the lungs','A liquid made of plasma and cells','A sheet of muscle under the lungs'],'The heart is a muscular organ that pumps blood. The blood carries oxygen and nutrients and helps remove waste such as carbon dioxide.','Heart slides'),
 heartQ('Right side of the heart (blue) = oxygen-POOR blood. Left side (red) = oxygen-RICH blood. In the picture, the heart is shown as if you are looking at someone: their right side is on YOUR left.','Heart slides'),
 order('Follow the blood around the body! Put the journey in order, starting with blood coming back from the body.',[
   'Superior vena cava brings oxygen-poor blood from the head, chest and arms',
   'Right atrium receives it and pumps it into the right ventricle',
   'Right ventricle pumps it to the lungs through the pulmonary arteries',
   'Pulmonary veins bring oxygen-rich blood back from the lungs',
   'Left atrium receives it and pumps it into the left ventricle',
   'Left ventricle pumps it to the whole body through the aorta'],
   'Right side = body to lungs. Left side = lungs to body. The heart and lungs work together as a team!','Heart slides'),
 mc('Which part of the heart pumps oxygen-rich blood to the rest of the body through the aorta?','Left ventricle',['Right ventricle','Left atrium','Right atrium'],'The left ventricle pumps oxygen-rich blood out through the aorta, the main artery.','Heart slides'),
 mc('Which blood vessels carry oxygen-poor blood from the heart to the lungs?','Pulmonary arteries',['Pulmonary veins','Aorta','Superior vena cava'],'Pulmonary arteries leave the right ventricle and go to the lungs. Pulmonary veins bring oxygen-rich blood back.','Heart slides'),
 tf('The pulmonary veins carry oxygen-rich blood from the lungs to the heart.',true,'Yes! Pulmonary veins: lungs → left atrium, full of fresh oxygen.','Heart slides'),
 mc('What happens to the blood in the lungs?','It loses carbon dioxide and gains oxygen',['It loses oxygen and gains carbon dioxide','It loses plasma and gains platelets','Nothing - blood only passes through'],'In the lungs the blood loses carbon dioxide (you breathe it out) and gains fresh oxygen (from the air you breathe in).','Heart slides'),
 sort('Sort & Review (from your worksheet): artery, vein or capillary?',['Artery','Vein','Capillary'],[
   ['Carries blood AWAY from the heart',0],
   ['Has valves to stop blood flowing backwards',1],
   ['Microscopic, walls only one cell thick',2],
   ['Has thick, muscular walls',0],
   ['Carries blood TO the heart',1],
   ['Example: the aorta',0],
   ['Example: the vena cava',1],
   ['Surrounds the alveoli in the lungs',2],
   ['Gas exchange happens through its thin walls',2]],
   'Arteries: away from heart, high pressure, thick walls. Veins: to the heart, low pressure, valves. Capillaries: tiny, thin walls, exchange.','Blood vessels slides + worksheet'),
 mc('Why do veins have valves?','To stop blood flowing backwards',['To make blood move faster','To add oxygen to the blood','To fight germs'],'Blood in veins is at low pressure, so valves prevent backflow.','Blood vessels slides'),
 mc('Why do arteries have thick, muscular walls?','Blood leaves the heart at high pressure',['They carry blood slowly','They need to exchange gases','They carry air'],'Blood travels at HIGH pressure in arteries (e.g. the aorta), so the walls must be thick and strong.','Blood vessels slides + Revision pack'),
 match('Match each part of blood to its job.',[
   ['Red blood cells','Transport oxygen around the body'],
   ['White blood cells','Fight infections (the body\'s soldiers)'],
   ['Platelets','Help the blood clot and form a scab'],
   ['Plasma','Yellowish liquid that carries everything else']],
   'Red = oxygen. White = soldiers. Platelets = plug the cut. Plasma = the highway.','Blood slides'),
 mc('About how much of your blood is plasma?','About 55%',['About 5%','About 20%','About 99%'],'Plasma makes up about 55% of blood. White blood cells are less than 1%.','Blood slides'),
 mc('You scrape your knee and a scab forms. Which part of the blood helped?','Platelets',['Red blood cells','Plasma only','White blood cells'],'Platelets are small sticky cell fragments. They stick together to form a plug and help the blood clot into a scab.','Blood slides'),
 multi('Tick ALL the jobs of blood.',['Brings oxygen and nutrients to cells','Removes carbon dioxide and waste','Delivers hormones to organs','Fights infection'],['Makes air for the lungs','Digests food in the stomach'],'Blood: brings oxygen + nutrients, removes CO2 + waste, delivers hormones, fights infection, helps wounds heal.','Blood slides'),
 fill('Blood leaves the heart in large ___, passes through tiny ___ where oxygen and nutrients move into the cells, and returns to the heart in ___.',['arteries','capillaries','veins'],['arteries','capillaries','veins','alveoli','plasma'],'Arteries → capillaries → veins → heart.','Revision pack'),
 mc('Which foods help your body make red blood cells?','Iron-rich foods: spinach, beans and meat',['Sweets and fizzy drinks','Only water','Salt and sugar'],'Iron-rich foods help make red blood cells. Exercise and water keep your heart and vessels healthy.','Blood slides')
]},

{id:'lungs', ico:'🫁', name:'Lungs & Breathing', blurb:'Trachea, bronchi, alveoli, diaphragm, gas exchange', col:'#06b6d4', Q:[
 order('Follow the air! Put the journey of a breath in order.',[
   'Air enters through the nose or mouth (and is warmed)',
   'Air travels down the trachea',
   'The trachea splits into two bronchi, one for each lung',
   'Each bronchus divides into smaller bronchioles',
   'Air reaches the alveoli at the end of the bronchioles'],
   'Nasal cavity/mouth → trachea → bronchi → bronchioles → alveoli.','Respiratory System slides'),
 mc('What is the role of the respiratory system?','To move air into the body and remove waste products',['To pump blood around the body','To digest food','To fight germs'],'Cells need oxygen for respiration. The respiratory system gets oxygen in and carbon dioxide out.','Respiratory System slides'),
 match('Match each part of the respiratory system to its job.',[
   ['Trachea','Long tube (windpipe) from the nose and mouth to the lungs'],
   ['Bronchus','Branch of the trachea that enters each lung'],
   ['Bronchioles','Smaller tubes that each bronchus divides into'],
   ['Alveoli','Tiny air sacs where gas exchange happens'],
   ['Diaphragm','Sheet of muscle that helps you breathe in and out']],
   'Trachea → two bronchi → bronchioles → alveoli. The diaphragm moves the air.','Respiratory System slides'),
 mc('What happens to the air in your nasal cavity and mouth?','It is warmed up',['It is turned into carbon dioxide','It is filled with blood','It is made colder'],'Air is warmed as it enters through the mouth and nasal cavity.','Respiratory System slides'),
 mc('How many bronchi does the trachea split into?','Two - one for each lung',['One','Three','Millions'],'The trachea branches into two bronchi. One bronchus enters each lung. There are MILLIONS of alveoli, though!','Respiratory System slides'),
 multi('Which features make the alveoli perfect for gas exchange? Tick ALL.',['Walls only one cell thick','Large, moist surface area','Surrounded by capillaries (rich blood supply)'],['Thick muscular walls','Filled with plasma'],'Thin walls = short distance for diffusion. Large moist surface = gases dissolve. Capillaries = blood supply.','Respiratory System slides'),
 fill('Oxygen moves from the ___ into the blood. Carbon dioxide moves from the blood into the lungs so it can be ___.',['alveoli','exhaled'],['alveoli','exhaled','trachea','digested'],'Gas exchange: oxygen in (alveoli → blood), carbon dioxide out (blood → alveoli → exhaled).','Respiratory System slides + Revision pack'),
 mc('Which vessels surround the alveoli and absorb the oxygen?','Capillaries',['Arteries','Veins','Bronchioles'],'Capillaries around the alveoli have very thin walls so oxygen can pass into the blood.','Blood vessels slides'),
 sort('Breathing in or breathing out?',['Inhale (in)','Exhale (out)'],[
   ['The diaphragm contracts and moves DOWN',0],
   ['The diaphragm relaxes and moves UP',1],
   ['The ribcage moves up and out',0],
   ['The chest cavity gets bigger',0],
   ['Carbon dioxide leaves the body',1],
   ['Air full of oxygen comes in',0]],
   'Inhale: diaphragm contracts and moves down, chest expands. Exhale: diaphragm relaxes and moves up.','Respiratory System slides + Revision pack'),
 tf('When you breathe in, the diaphragm contracts and moves downwards.',true,'Correct. It relaxes and moves upwards when you breathe out.','Respiratory System slides'),
 mc('Why do your body cells need oxygen?','For respiration, to release energy',['To make carbon dioxide only','To make bones grow','To warm the air'],'Body cells require oxygen for respiration - releasing energy.','Respiratory System slides'),
 mc('A runner is in a race. What happens to their breathing and why?','Faster and deeper, because muscles need more oxygen and make more carbon dioxide',['Slower, because they are tired','No change','Faster, because the trachea gets wider'],'During exercise muscle cells need much more energy, so you breathe faster and deeper to bring in more oxygen and remove more CO2.','Revision pack challenge'),
 mc('Heart + lungs teamwork: how does oxygen from the air reach the cells in your legs?','Alveoli → capillaries → blood → heart pumps it round the body',['Trachea → stomach → legs','Diaphragm → veins → legs','Bronchi → plasma → skin'],'Oxygen diffuses into the blood in the alveoli, returns to the heart (left side), and the left ventricle pumps it out through the aorta.','Revision pack quick questions'),
 mc('Another name for the trachea is...','The windpipe',['The air sac','The food pipe','The lung muscle'],'The trachea is the windpipe, a long tube with cartilage rings.','Revision pack')
]},

{id:'repro', ico:'🌱', name:'Puberty & Reproductive System', blurb:'Hormones, changes, male & female organs, egg to baby', col:'#17b26a', Q:[
 mc('What is puberty?','The changes in boys and girls as they mature into adults',['An illness caused by germs','A part of the heart','A type of vitamin'],'Puberty describes the changes as boys and girls mature into adults, including changes in the reproductive system.','Puberty slides'),
 mc('Girls usually begin puberty between...','8 and 14 years old (average 11)',['3 and 5 years old','15 and 18 years old','20 and 25 years old'],'Girls: 8-14 (average 11), usually finish in about 4 years. Boys: 9-14 (average 12), usually finish after about 6 years.','Puberty slides'),
 mc('Which is true about when puberty finishes?','Girls usually finish sooner (about 4 years) than boys (about 6 years)',['Boys always finish before girls','Everyone finishes at exactly 15','Puberty never finishes'],'Girls develop more quickly than boys and finish in about 4 years. Most boys finish after about six years.','Puberty slides'),
 tf('Everyone starts puberty at exactly the same age and changes at exactly the same speed.',false,'No! Changes happen at different times and rates for each person - that is normal.','Revision pack'),
 mc('What are hormones?','Chemical messengers made in glands and carried by the blood',['Tiny living germs','Parts of the heart','Foods rich in iron'],'Hormones are chemical messengers produced in glands. They bring about puberty and regulate the reproductive system.','Puberty slides'),
 match('Match the hormone / word to its description.',[
   ['Estrogen','Made by the ovaries - controls female development'],
   ['Testosterone','Made by the testes - controls male development'],
   ['Hormones','Chemical messengers carried in the blood']],
   'Estrogen = ovaries. Testosterone = testes.','Puberty slides'),
 sort('Boys, girls or both? Sort the puberty changes.',['Boys','Girls','Both'],[
   ['Voice breaks (gets deeper)',0],
   ['Hair grows on the face and chest',0],
   ['Testes begin to produce sperm',0],
   ['Breasts begin to develop',1],
   ['Hips widen',1],
   ['Ovaries release egg cells (periods begin)',1],
   ['Growth rate increases',2],
   ['Underarm hair grows',2],
   ['Body smell gets stronger',2],
   ['Pimples and acne',2]],
   'Both: growth spurt, hair under arms and pubic hair, body smell, pimples. Boys: voice, testes, face hair. Girls: breasts, hips, periods.','Puberty slides'),
 mc('Why is washing regularly and wearing clean clothes important during puberty?','Bodies sweat more and body smell gets stronger',['It makes you taller','It stops puberty','Germs make your voice deeper'],'More sweat and stronger body odour - good hygiene helps manage this.','Revision pack'),
 match('Match each reproductive organ to its role.',[
   ['Ovary','Produces egg cells'],
   ['Oviduct','Carries an egg from the ovary towards the uterus'],
   ['Uterus','Where a baby can grow before birth'],
   ['Birth canal (vagina)','Muscular tube where the baby exits the body'],
   ['Testes','Produce sperm cells (and hormones)'],
   ['Sperm duct','Carries sperm away from the testes'],
   ['Penis','Passes urine and sperm out of the body']],
   'Female: ovary, oviduct, uterus, birth canal. Male: testes, sperm duct, penis.','Reproductive System slides + Revision pack'),
 order('From egg to baby: put the steps in order.',[
   'An ovary releases a mature egg',
   'The egg travels along the oviduct',
   'A sperm cell fertilises the egg',
   'The embryo implants in the wall of the uterus',
   'The embryo develops into a baby during pregnancy'],
   'Egg released → oviduct → fertilisation → implants in uterus → baby.','Reproductive System slides'),
 mc('What are cilia in the oviduct?','Hair-like cells that help move the egg to the uterus',['Tiny sperm cells','Muscles that make a period','A type of hormone'],'The oviducts are lined with cilia (hair-like cells) to move the egg from the ovary to the uterus.','Reproductive System slides'),
 mc('If an egg is NOT fertilised, what happens to the lining of the uterus?','It comes away as a period',['It turns into a baby','It stays forever','It travels to the ovary'],'The lining of the uterus wall comes away as a period if the egg is not fertilised.','Reproductive System slides'),
 mc('What are the two key jobs of the testes?','Making sperm cells and hormones',['Carrying urine and making eggs','Pumping blood and breathing','Digesting food'],'The testes make millions of sperm and hormones that affect how the male body develops in puberty.','Reproductive System slides'),
 mc('Which tube inside the penis do both sperm and urine pass through?','The urethra',['The oviduct','The trachea','The sperm duct only'],'The penis contains the urethra, which sperm and urine pass through to leave the body.','Reproductive System slides'),
 tf('The ovaries contain undeveloped egg cells that are present from birth.',true,'Yes - the two ovaries hold undeveloped eggs (ova) from birth and also make hormones.','Reproductive System slides'),
 mc('A change in puberty worries you. What should you do?','Speak with a trusted adult or health professional',['Hide it and say nothing','Ask a stranger online','Ignore it forever'],'Puberty is a normal part of growing up. If a change or question worries you, talk to a trusted adult.','Revision pack')
]},

{id:'bugs', ico:'🦟', name:'Insect Bites & Insect-borne Diseases', blurb:'Malaria, sleeping sickness, yellow fever, bite-proof tips', col:'#f59e0b', Q:[
 mc('What is an insect-borne disease?','A disease spread when an infected insect bites someone',['A disease caused by eating insects','A disease that only insects get','A disease caused by cold weather'],'An infected insect can carry harmful microorganisms and pass them into a person when it bites. This is an insect-borne disease.','Insect Bites slides'),
 order('How an insect-borne disease spreads: put the steps in order.',[
   'An infected insect carries a harmful microorganism',
   'The infected insect bites a person',
   'The microorganism enters the person and the disease spreads'],
   'Step 1 infected insect - Step 2 it bites - Step 3 disease spreads.','Insect Bites slides'),
 match('Who spreads what? Match the disease to the insect.',[
   ['Malaria','Infected female Anopheles mosquito'],
   ['Sleeping sickness','Infected tsetse fly'],
   ['Yellow fever','Infected mosquito']],
   'Malaria and yellow fever: mosquitoes. Sleeping sickness: tsetse fly.','Insect Bites slides + Revision pack'),

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- session ---------- */
function prep(q,topic){
  const x=Object.assign({},q,{topic});
  if(q.t==='mc'){x.opts=shuf([q.a].concat(q.w))}
  if(q.t==='tf'){x.opts=['True','False']}
  if(q.t==='multi'){x.opts=shuf(q.a.concat(q.w))}
  if(q.t==='order'){x.pool=shuf(q.items.map((s,i)=>({s,i})));if(x.pool.every((p,i)=>p.i===i))x.pool.reverse()}
  if(q.t==='match'){x.right=shuf(q.pairs.map((p,i)=>({s:p[1],i})))}
  if(q.t==='fill'){x.bankS=shuf(q.bank)}
  return x;
}
function start(id,customQs){
  let qs=[];
  if(customQs){qs=customQs}
  else if(id==='boss'){
    const all=[];TOPICS.forEach(t=>t.Q.forEach(q=>all.push([q,t.id])));
    // balance: >=4 per core topic, rest random
    const chosen=[];TOPICS.filter(t=>!t.bonus).forEach(t=>pick(t.Q.map(q=>[q,t.id]),5).forEach(c=>chosen.push(c)));
    const rest=all.filter(a=>!chosen.some(c=>c[0]===a[0]));
    pick(rest,25-chosen.length).forEach(c=>chosen.push(c));
    qs=shuf(chosen).map(c=>prep(c[0],c[1]));
  }else{
    const t=TOPICS.find(x=>x.id===id);
    qs=shuf(t.Q).map(q=>prep(q,id));
  }
  S={id,qs,i:0,score:0,xp:0,combo:0,wrong:[],byTopic:{},answered:false};
  show();
}
function show(){
  const q=S.qs[S.i];S.answered=false;S.cur={};
  const tname=(TOPICS.find(t=>t.id===q.topic)||{}).name||'';
  app.innerHTML=`<div class="qtop"><button class="xbtn" id="quit" title="Quit">✕</button>
    <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
    <span class="chip">${S.i+1}/${S.qs.length}</span><span class="chip">⭐ ${S.xp}</span>${S.combo>=2?`<span class="chip combo">🔥 ${S.combo}</span>`:''}</div>
  <div class="qcard"><div class="qtag">${esc(tname)}</div><p class="qtext">${q.t==='fill'?'Fill in the gaps:':esc(q.q)}</p><div id="body"></div>
  <div class="fb" id="fb"></div><div class="actions"><button class="btn" id="check" disabled>Check</button><button class="btn" id="next" style="display:none">Next →</button></div></div>`;
  $('#quit').onclick=()=>{if(confirm('Quit this round?'))home()};
  $('#next').onclick=next;$('#check').onclick=()=>finish(R[q.t].check(q));
  R[q.t].render(q,$('#body'));
}
function setReady(ok){const b=$('#check');if(b)b.disabled=!ok}
function finish(score,detailHtml){
  if(S.answered)return;S.answered=true;
  const q=S.qs[S.i];
  const ok=score>=0.999;
  if(ok){S.combo++;}else{S.combo=0;S.wrong.push(q)}
  const gain=Math.round(10*score)+(ok?Math.min(S.combo,5)*2:0);
  S.xp+=gain;S.score+=score;
  const bt=S.byTopic[q.topic]||(S.byTopic[q.topic]={s:0,n:0});bt.s+=score;bt.n++;
  const fb=$('#fb');
  fb.className='fb show '+(ok?'good':score>0?'part':'bad');
  const head=ok?['Yes! 🎉','Perfect!','Nailed it! 💪','Scientist level! 🔬'][S.i%4]:(score>0?'Almost! Some parts were right.':'Not this time - read the fact below. 📚');
  fb.innerHTML=`<b class="h">${head} +${gain} XP${ok&&S.combo>=2?' 🔥 combo x'+S.combo:''}</b>${q.t==='mc'||q.t==='tf'?'':''}<div>${esc(q.e||'')}</div>${q.s?`<div class="src">From: ${esc(q.s)}</div>`:''}`;
  $('#check').style.display='none';
  const n=$('#next');n.style.display='';n.textContent=S.i===S.qs.length-1?'See results →':'Next →';n.focus();
  if(ok&&S.combo>0&&S.combo%5===0)confetti(60);
}
function next(){
  if(S.i<S.qs.length-1){S.i++;show()}else results();
}
function results(){
  const n=S.qs.length,pct=Math.round(S.score/n*100);
  if(S.id!=='boss'&&!S.custom){saved.best[S.id]=Math.max(saved.best[S.id]||0,pct)}
  else if(S.id==='boss'){saved.best.boss=Math.max(saved.best.boss||0,pct)}
  saved.xp+=S.xp;store.set(saved);
  const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const weak=Object.entries(S.byTopic).map(([k,v])=>({t:TOPICS.find(x=>x.id===k),p:Math.round(v.s/v.n*100),n:v.n})).filter(w=>w.p<80).sort((a,b)=>a.p-b.p);
  const msg=pct>=90?'Incredible! You are ready for the test. 🏆':pct>=70?'Great job! A little more practice on the weak spots and you are ready.':pct>=40?'Good start! Read the cheat sheet and try again.':'Don\'t worry - read the cheat sheet, then try again. Every try makes you stronger!';
  app.innerHTML=`<div class="qcard res"><div class="big">${pct>=70?'🎉':'💪'}</div><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
  <div class="scorebig">${pct}%</div><p>${Math.round(S.score*10)/10} out of ${n} · +${S.xp} XP</p><p>${msg}</p>
  ${weak.length?`<div class="weak"><b>Practice more:</b><ul>${weak.map(w=>`<li>${w.t.ico} ${w.t.name} - ${w.p}% <button class="btn ghost" style="padding:2px 10px;box-shadow:none" data-sheet="${w.t.id}">cheat sheet</button></li>`).join('')}</ul></div>`:''}
  <div class="row" style="justify-content:center">
   ${S.wrong.length?`<button class="btn" id="redo">Retry my ${S.wrong.length} mistakes</button>`:''}
   <button class="btn ghost" id="again">Play again</button><button class="btn gray" id="home">Home</button></div></div>`;
  if(pct>=70)confetti(pct>=90?220:110);
  app.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>sheet(b.dataset.sheet));
  $('#home').onclick=home;$('#again').onclick=()=>start(S.id);
  const r=$('#redo');if(r){const w=S.wrong.map(q=>prep(q,q.topic));r.onclick=()=>{const id=S.id;start(id,w);S.custom=true}}
}

/* ---------- renderers ---------- */
const R={};
/* multiple choice + true/false */
R.mc=R.tf={
  render(q,el){
    el.innerHTML=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(S.answered)return;
      const val=q.opts[+b.dataset.i];
      const right=q.t==='tf'?(q.v?'True':'False'):q.a;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const v=q.opts[+x.dataset.i];if(v===right)x.classList.add('ok');else if(x===b)x.classList.add('no')});
      finish(val===right?1:0);
    });
    $('#check').style.display='none';
  },
  check(){return 0}
};
/* multi select */
R.multi={
  render(q,el){
    S.cur.sel=new Set();
    el.innerHTML=`<p class="sub" style="margin:0 0 8px">Choose all that apply, then press Check.</p><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(S.answered)return;const i=+b.dataset.i;
      if(S.cur.sel.has(i)){S.cur.sel.delete(i);b.classList.remove('sel')}else{S.cur.sel.add(i);b.classList.add('sel')}
      setReady(S.cur.sel.size>0);
    });
  },
  check(q){
    const els=document.querySelectorAll('#body .opt');let good=0,bad=0;
    els.forEach(b=>{b.disabled=true;const i=+b.dataset.i,isC=q.a.includes(q.opts[i]),chosen=S.cur.sel.has(i);
      if(isC){b.classList.add('ok');if(chosen)good++}else if(chosen){b.classList.add('no');bad++}});
    return Math.max(0,(good-bad)/q.a.length);
  }
};
/* order */
R.order={
  render(q,el){
    S.cur.seq=[];
    const draw=()=>{
      el.innerHTML=`<p class="sub" style="margin:0 0 8px">Tap the steps in the right order (tap a placed step to remove it).</p>
      <div class="seq">${q.items.map((_,k)=>{const p=S.cur.seq[k];return `<div class="slot" data-k="${k}"><span class="n">${k+1}</span><span class="t">${p?esc(p.s):'<span style="color:#b6b2d6">...</span>'}</span></div>`}).join('')}</div>
      <div class="pool">${q.pool.map((p,j)=>`<button class="tile ${S.cur.seq.includes(p)?'used':''}" data-j="${j}">${esc(p.s)}</button>`).join('')}</div>`;
      el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(S.answered)return;S.cur.seq.push(q.pool[+b.dataset.j]);draw();setReady(S.cur.seq.length===q.items.length)});
      el.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(S.answered)return;const k=+s.dataset.k;if(S.cur.seq[k]){S.cur.seq.splice(k,1);draw();setReady(S.cur.seq.length===q.items.length)}});
    };S.cur.draw=draw;draw();
  },
  check(q){
    let good=0;const el=$('#body');
    el.querySelectorAll('.tile').forEach(b=>b.disabled=true);
    el.querySelectorAll('.slot').forEach((s,k)=>{const p=S.cur.seq[k];if(p.i===k){good++;s.classList.add('ok')}else{s.classList.add('no');s.querySelector('.t').innerHTML=esc(p.s)+'<br><small>✅ should be: '+esc(q.items[k])+'</small>'}});
    return good/q.items.length;
  }
};
/* match */
R.match={
  render(q,el){
    S.cur.pair={};S.cur.act=null;
    const draw=()=>{
      const used=Object.values(S.cur.pair);
      el.innerHTML=`<p class="sub" style="margin:0 0 8px">Tap a word on the left, then its match on the right. Tap a pair again to undo.</p><div class="mcols">
      <div class="mcol">${q.pairs.map((p,i)=>`<button class="mi ${S.cur.pair[i]!=null?'pc'+(i%7):''} ${S.cur.act===i?'act':''}" data-l="${i}">${esc(p[0])}${S.cur.pair[i]!=null?'<span class="tg">●</span>':''}</button>`).join('')}</div>
      <div class="mcol">${q.right.map((r,j)=>{const li=Object.keys(S.cur.pair).find(k=>S.cur.pair[k]===j);return `<button class="mi ${li!=null?'pc'+(li%7):''}" data-r="${j}">${esc(r.s)}</button>`}).join('')}</div></div>`;
      el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(S.answered)return;const i=+b.dataset.l;if(S.cur.pair[i]!=null){delete S.cur.pair[i];S.cur.act=i}else S.cur.act=i;draw();setReady(Object.keys(S.cur.pair).length===q.pairs.length)});
      el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(S.answered)return;const j=+b.dataset.r;
        const owner=Object.keys(S.cur.pair).find(k=>S.cur.pair[k]===j);
        if(owner!=null){delete S.cur.pair[owner];S.cur.act=+owner}
        else if(S.cur.act!=null){S.cur.pair[S.cur.act]=j;
          const nxt=q.pairs.findIndex((_,i)=>S.cur.pair[i]==null);S.cur.act=nxt>=0?nxt:null}
        draw();setReady(Object.keys(S.cur.pair).length===q.pairs.length)});
    };draw();
  },
  check(q){
    let good=0;const el=$('#body');
    el.querySelectorAll('.mi').forEach(b=>b.disabled=true);
    q.pairs.forEach((p,i)=>{const j=S.cur.pair[i],ok=q.right[j].i===i;if(ok)good++;
      const lb=el.querySelector(`[data-l="${i}"]`),rb=el.querySelector(`[data-r="${j}"]`);
      lb.classList.add(ok?'ok':'no');rb.classList.add(ok?'ok':'no');
      if(!ok){lb.innerHTML=esc(p[0])+'<br><small>✅ '+esc(p[1])+'</small>'}});
    return good/q.pairs.length;
  }
};
/* sort */
R.sort={
  render(q,el){
    S.cur.ch={};S.cur.order=shuf(q.items.map((_,i)=>i));
    const draw=()=>{
      el.innerHTML=`<p class="sub" style="margin:0 0 8px">Choose a group for every card, then press Check.</p><div class="srt">${S.cur.order.map(i=>`<div class="srow" data-i="${i}"><div>${esc(q.items[i][0])}</div><div class="cats">${q.cats.map((c,k)=>`<button class="cb ${S.cur.ch[i]===k?'sel':''}" data-i="${i}" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>`).join('')}</div>`;
      el.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{if(S.answered)return;S.cur.ch[+b.dataset.i]=+b.dataset.k;draw();setReady(Object.keys(S.cur.ch).length===q.items.length)});
    };draw();
  },
  check(q){
    let good=0;const el=$('#body');
    el.querySelectorAll('.cb').forEach(b=>b.disabled=true);
    q.items.forEach((it,i)=>{const row=el.querySelector(`.srow[data-i="${i}"]`);if(S.cur.ch[i]===it[1]){good++;row.classList.add('ok')}else{row.classList.add('no');row.insertAdjacentHTML('beforeend',`<div class="fix">✅ should be: ${esc(q.cats[it[1]])}</div>`)}});
    return good/q.items.length;
  }
};
/* fill in the gaps */
R.fill={
  render(q,el){
    const parts=q.q.split('___');S.cur.b=new Array(q.ans.length).fill(null);
    const draw=()=>{
      let h='<div class="fillq">';
      parts.forEach((p,i)=>{h+=esc(p);if(i<q.ans.length)h+=`<span class="blank" data-b="${i}">${S.cur.b[i]!=null?esc(q.bankS[S.cur.b[i]]):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`});
      h+='</div><p class="sub" style="margin:8px 0">Tap a word to put it in the next gap. Tap a filled gap to remove the word.</p><div class="pool">'+q.bankS.map((w,j)=>`<button class="tile ${S.cur.b.includes(j)?'used':''}" data-j="${j}">${esc(w)}</button>`).join('')+'</div>';
      el.innerHTML=h;
      el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(S.answered)return;const k=S.cur.b.indexOf(null);if(k<0)return;S.cur.b[k]=+b.dataset.j;draw();setReady(!S.cur.b.includes(null))});
      el.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{if(S.answered)return;S.cur.b[+b.dataset.b]=null;draw();setReady(false)});
    };draw();
  },
  check(q){
    let good=0;const el=$('#body');
    el.querySelectorAll('.blank').forEach((b,i)=>{const w=q.bankS[S.cur.b[i]];if(w===q.ans[i]){good++;b.classList.add('ok')}else{b.classList.add('no');b.innerHTML=esc(w)+' → <u>'+esc(q.ans[i])+'</u>'}});
    el.querySelectorAll('.tile').forEach(b=>b.disabled=true);
    return good/q.ans.length;
  }
};
/* heart diagram */
const HP=[
 ['Superior vena cava',140,60],['Right atrium',145,140],['Right ventricle',145,270],['Pulmonary artery',55,258],
 ['Pulmonary vein',300,60],['Left atrium',295,140],['Left ventricle',295,270],['Aorta',385,258]];
R.heart={
  render(q,el){
    S.cur.ls=shuf(HP.map((_,i)=>i));S.cur.pick={};
    const svg=`<svg viewBox="0 0 440 370" width="100%" role="img" aria-label="Schematic heart">
      <rect x="120" y="24" width="40" height="70" fill="#4c8bf5"/><rect x="280" y="24" width="40" height="70" fill="#ef5350"/>
      <rect x="90" y="90" width="110" height="105" rx="30" fill="#7aa7ff" stroke="#26224a" stroke-width="3"/><rect x="240" y="90" width="110" height="105" rx="30" fill="#ff8a86" stroke="#26224a" stroke-width="3"/>
      <rect x="90" y="203" width="110" height="140" rx="38" fill="#4c8bf5" stroke="#26224a" stroke-width="3"/><rect x="240" y="203" width="110" height="140" rx="38" fill="#ef5350" stroke="#26224a" stroke-width="3"/>
      <rect x="10" y="238" width="82" height="38" fill="#4c8bf5" stroke="#26224a" stroke-width="3"/><rect x="348" y="238" width="82" height="38" fill="#ef5350" stroke="#26224a" stroke-width="3"/>
      <text x="220" y="12" font-size="13" text-anchor="middle" fill="#6b6890">from body ↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ↓ from lungs</text>
      <text x="48" y="300" font-size="12" text-anchor="middle" fill="#6b6890">to lungs</text><text x="392" y="300" font-size="12" text-anchor="middle" fill="#6b6890">to body</text>
      <text x="145" y="362" font-size="13" text-anchor="middle" fill="#4c8bf5" font-weight="700">oxygen-poor</text><text x="295" y="362" font-size="13" text-anchor="middle" fill="#ef5350" font-weight="700">oxygen-rich</text>
      ${HP.map((p,i)=>`<circle cx="${p[1]}" cy="${p[2]}" r="15" fill="#fff" stroke="#26224a" stroke-width="3"/><text x="${p[1]}" y="${p[2]+6}" font-size="17" font-weight="800" text-anchor="middle" fill="#26224a">${i+1}</text>`).join('')}</svg>`;
    el.innerHTML=`<div class="heartbox"><div>${svg}</div><div class="hl">${HP.map((p,i)=>`<label><span class="num">${i+1}</span><select data-i="${i}"><option value="">choose...</option>${S.cur.ls.map(k=>`<option value="${k}">${esc(HP[k][0])}</option>`).join('')}</select></label>`).join('')}</div></div>`;
    el.querySelectorAll('select').forEach(s=>s.onchange=()=>{S.cur.pick[+s.dataset.i]=s.value===''?null:+s.value;setReady(HP.every((_,i)=>S.cur.pick[i]!=null))});
  },
  check(){
    let good=0;
    document.querySelectorAll('#body select').forEach(s=>{const i=+s.dataset.i;s.disabled=true;if(+s.value===i){good++;s.classList.add('ok')}else{s.classList.add('no');s.insertAdjacentHTML('afterend',`<small style="grid-column:2">✅ ${esc(HP[i][0])}</small>`)}});
    return good/HP.length;
  }
};

/* ---------- confetti ---------- */
function confetti(n){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,c:['#6c4cf1','#17b26a','#f59e0b','#ef5350','#06b6d4','#d946ef'][Math.floor(Math.random()*6)],r:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<150)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}
document.addEventListener('keydown',e=>{
  if(!S)return;
  if(e.key==='Enter'){const n=$('#next');if(n&&n.style.display!=='none'){e.preventDefault();n.click()}else{const c=$('#check');if(c&&!c.disabled&&c.style.display!=='none')c.click()}}
  const q=S.qs[S.i];
  if(q&&(q.t==='mc'||q.t==='tf')&&!S.answered){const k=+e.key;if(k>=1&&k<=q.opts.length){const b=document.querySelectorAll('.opt')[k-1];if(b)b.click()}}
});
home();
